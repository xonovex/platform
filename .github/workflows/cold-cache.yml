name: Cold cache

# A cold run is the only one that exercises npm ci against a tree where every
# generated file is absent, which is where a bin whose target is built rather
# than committed stops being linked. Every other run restores a warm .moon/cache
# that hides it.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-cache:
    name: Cold cache
    permissions:
      contents: read
      pull-requests: write
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      cache-workspace: false
