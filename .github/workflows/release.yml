name: Release

on:
  workflow_dispatch:
    inputs:
      cache-workspace:
        description: "Cache .moon/cache and node_modules"
        type: boolean
        default: true
      base:
        description: "Base ref for affected detection (e.g. HEAD~1, v0.1.18)"
        type: string
        default: "HEAD~1"
      publish:
        description: "Publish for real instead of a dry run"
        type: boolean
        default: false
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.title, 'version packages'))

    permissions:
      contents: write
      id-token: write
      packages: write
      actions: write # cache-nix-action purge deletes old caches via the Actions cache API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache-workspace: ${{ inputs.cache-workspace }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - run: rm -f .moon/cache/runReport.json

      - name: Publish
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ inputs.base || 'HEAD~1' }}
        run: |
          # npm resolves its project config from each package directory, not the
          # workspace root, so the root .npmrc token reference never applies to a
          # publish; the user config is the one place npm always reads.
          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc
          nix develop --no-update-lock-file --command npm ci
          nix develop --no-update-lock-file --command npx moon run :ci-publish --affected --color --concurrency 1 --base "$BASE"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          BASE: ${{ inputs.base || 'HEAD~1' }}
        run: |
          nix develop --no-update-lock-file --command npm ci
          nix develop --no-update-lock-file --command npx moon run :ci-publish-dry-run --affected --color --concurrency 1 --base "$BASE"

      - uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6 # v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
