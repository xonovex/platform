name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache-workspace:
        description: "Cache .moon/cache and node_modules"
        type: boolean
        default: true
  workflow_call:
    inputs:
      cache-workspace:
        description: "Cache .moon/cache and node_modules"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      actions: write # cache-nix-action purge deletes old caches via the Actions cache API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # asset-images:asset-check asserts a real PNG mime type, which fails
          # against the pointer files a non-LFS checkout leaves behind.
          lfs: true

      - uses: $/.github/actions/setup-nix
        with:
          cache-workspace: ${{ inputs.cache-workspace }}

      - run: rm -f .moon/cache/runReport.json
      # A push can hold more than one commit, and moon compares with the previous
      # commit unless it gets a base. The gate also holds the dependents of each
      # changed project, which moon adds only with --include-relations.
      - run: |
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || BASE=
          nix develop --no-update-lock-file --command npm ci
          nix develop --no-update-lock-file --command npx moon ci --color --concurrency 4 --include-relations --downstream deep ${BASE:+--base "$BASE"} :ci-check
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || '' }}

      - uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6 # v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
