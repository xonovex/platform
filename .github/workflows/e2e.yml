# Manually dispatched Kubernetes test coverage for the four Kind-based e2e suites
# (e2e, e2e-gvisor, e2e-kata, e2e-coco). Ordinary CI owns envtest integration.
#
# Trigger this workflow with workflow_dispatch.
#
# First-run expectations:
# - Each e2e suite creates its own Kind cluster on the hosted runner (Docker is
#   preinstalled on ubuntu-latest); kind/kubectl/setup-envtest come from the nix
#   devshell.
# - e2e-gvisor downloads runsc; e2e-kata downloads a Kata release and needs
#   /dev/kvm for its VM-isolation test.
# - Kata VM-isolation and CoCo confidential-runtime tests self-skip in
#   unprivileged Kind: a green job with skips proves wiring, not runtime
#   isolation. Each job summary reports executed-vs-skipped counts per suite so
#   a pass-by-skip stays visible.
name: E2E

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            target: agent-operator-go:ci-e2e
          - suite: e2e-gvisor
            target: agent-operator-go:ci-e2e-gvisor
          - suite: e2e-kata
            target: agent-operator-go:ci-e2e-kata
          - suite: e2e-coco
            target: agent-operator-go:ci-e2e-coco

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Install repository dependencies
        run: nix develop --command npm ci

      - name: Run suite
        run: nix develop --command npx moon run "$MOON_TARGET" 2>&1 | tee "$RUNNER_TEMP/suite.log"
        env:
          MOON_TARGET: ${{ matrix.target }}
          SUITE: ${{ matrix.suite }}
          # Lets moon resolve the github:// nix toolchain plugin without API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report executed-vs-skipped counts
        if: always()
        run: |
          if [ -x node_modules/.bin/moon ]; then
            nix develop --command npx moon run agent-operator-go:ci-e2e-summary -- \
              "$SUITE" "$RUNNER_TEMP/suite.log" "$GITHUB_STEP_SUMMARY"
          else
            printf '### %s\n\nNo test log produced (repository dependencies failed to install).\n' "$SUITE" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE: ${{ matrix.suite }}
