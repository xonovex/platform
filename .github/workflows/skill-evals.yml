name: Skill model evals

on:
  workflow_dispatch:

concurrency:
  group: skill-model-evals-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    name: Select skill evals
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.select.outputs.skills }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache-workspace: true

      - name: Install repository dependencies
        run: nix develop --no-update-lock-file --command npm ci

      - id: select
        name: Select skill matrix
        shell: bash
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file --command npx moon query tasks \
            --id ci-skill-eval-trigger \
            >"${RUNNER_TEMP}/skill-eval-trigger-tasks.json"
          nix develop --no-update-lock-file --command npx moon query tasks \
            --id ci-skill-eval-output \
            >"${RUNNER_TEMP}/skill-eval-output-tasks.json"
          skills="$(nix develop --no-update-lock-file --command jq -sc \
            '[.[].tasks | keys[]] | unique | map({project: ., package: ltrimstr("skill-")})' \
            "${RUNNER_TEMP}/skill-eval-trigger-tasks.json" \
            "${RUNNER_TEMP}/skill-eval-output-tasks.json")"
          printf 'skills=%s\n' "${skills}" >>"${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval:
    name: ${{ matrix.skill.package }} ${{ matrix.mode }} eval
    needs: matrix
    if: needs.matrix.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [trigger, output]
        skill: ${{ fromJSON(needs.matrix.outputs.skills) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache-workspace: true

      - name: Require model-eval credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$ANTHROPIC_API_KEY"

      - name: Install repository dependencies
        run: nix develop --no-update-lock-file --command npm ci

      - name: Run skill evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOON_TARGET: ${{ matrix.skill.project }}:ci-skill-eval-${{ matrix.mode }}
        run: nix develop --no-update-lock-file --command npx moon run "$MOON_TARGET"

      - name: Upload benchmark evidence
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-eval-${{ matrix.skill.package }}-${{ matrix.mode }}
          path: packages/skill/${{ matrix.skill.project }}/.skill-eval-results/${{ matrix.mode }}
          if-no-files-found: warn
          retention-days: 30
