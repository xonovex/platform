name: Skill model evals

on:
  pull_request:
    paths:
      - ".github/workflows/skill-evals.yml"
      - ".moon/tasks/tag-skill.yml"
      - "packages/script/script-moon-common/**"
      - "packages/script/script-moon-skill-eval-outputs/**"
      - "packages/script/script-moon-skill-eval-triggers/**"
      - "packages/skill/**"
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Catalog coverage for a manual run
        required: true
        default: full
        type: choice
        options:
          - full
          - rotated

concurrency:
  group: skill-model-evals-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    name: Select skill evals
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       vars.SKILL_EVALS_ENABLED == 'true' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.select.outputs.skills }}
      routing_owners: ${{ steps.select.outputs.routing_owners }}
      scope: ${{ steps.select.outputs.scope }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache-workspace: true

      - name: Install repository dependencies
        run: nix develop --no-update-lock-file --command npm ci

      - id: select
        name: Select full or changed-skill matrix
        shell: bash
        run: |
          set -euo pipefail
          changed_file="-"
          scope="manual-full"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            changed_file="${RUNNER_TEMP}/changed-files.txt"
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" >"${changed_file}"
            scope="pull-request-changed"
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            scope="scheduled-rotation"
          elif [[ "${DISPATCH_SCOPE}" == "rotated" ]]; then
            scope="manual-rotation"
          fi
          limit=10000
          offset=0
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # The selector applies this bound only to shared evaluator changes;
            # directly changed skill packages are all retained.
            limit=8
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" || ( "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_SCOPE}" == "rotated" ) ]]; then
            # Three monthly slices cover the catalog while 90-day artifacts remain available.
            limit=32
            offset="$(((10#$(date -u +%m) - 1) * 32))"
          fi
          skills="$(node packages/skill/skill-skill/skill-guide/scripts/list-eval-matrix.mjs \
            packages/skill "${changed_file}" "${limit}" "${offset}")"
          printf 'skills=%s\n' "${skills}" >>"${GITHUB_OUTPUT}"
          routing_owners="$(jq -r '[.[].guide] | join(",")' <<<"${skills}")"
          printf 'routing_owners=%s\n' "${routing_owners}" >>"${GITHUB_OUTPUT}"
          printf 'scope=%s\n' "${scope}" >>"${GITHUB_OUTPUT}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DISPATCH_SCOPE: ${{ inputs.scope || 'full' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval:
    name: ${{ matrix.skill.package }} evals
    needs: matrix
    if: needs.matrix.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        skill: ${{ fromJSON(needs.matrix.outputs.skills) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache-workspace: true

      - name: Require model-eval credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY"
          test -n "$CODEX_API_KEY"

      - name: Install repository dependencies
        run: nix develop --no-update-lock-file --command npm ci

      - name: Run skill evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CLAUDE_MODEL: claude-haiku-4-5-20251001
          CODEX_MODEL: gpt-5.3-codex
          JUDGE_MODEL: claude-sonnet-4-6
          CODEX_JUDGE_MODEL: gpt-5.3-codex
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKILL_PROJECT: ${{ matrix.skill.project }}
        run: |
          set +e
          status=0
          for harness in claude codex; do
            export SKILL_EVAL_HARNESS="$harness"
            nix develop --no-update-lock-file --command \
              npx moon run "${SKILL_PROJECT}:ci-skill-eval-trigger" || status=1
            nix develop --no-update-lock-file --command \
              npx moon run "${SKILL_PROJECT}:ci-skill-eval-output" || status=1
          done
          exit "$status"

      - name: Upload benchmark evidence
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-eval-${{ matrix.skill.package }}
          path: packages/skill/${{ matrix.skill.project }}/.skill-eval-results
          if-no-files-found: warn
          retention-days: 90

  routing:
    name: Catalog routing (${{ matrix.harness }})
    needs: matrix
    if: needs.matrix.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache-workspace: true

      - name: Require model-eval credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          HARNESS: ${{ matrix.harness }}
        run: |
          set -euo pipefail
          if [[ "$HARNESS" == "codex" ]]; then
            test -n "$CODEX_API_KEY"
          else
            test -n "$ANTHROPIC_API_KEY"
          fi

      - name: Install repository dependencies
        run: nix develop --no-update-lock-file --command npm ci

      - name: Run competitive catalog routing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          SKILL_EVAL_HARNESS: ${{ matrix.harness }}
          CLAUDE_MODEL: claude-haiku-4-5-20251001
          CODEX_MODEL: gpt-5.3-codex
          SKILL_ROUTING_OWNERS: ${{ github.event_name == 'pull_request' && needs.matrix.outputs.routing_owners || '' }}
          SKILL_ROUTING_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
          SKILL_ROUTING_SPLIT: all
        run: >-
          nix develop --no-update-lock-file --command
          npx moon run script-moon-skill-eval-triggers:ci-routing

      - name: Upload routing evidence
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-routing-${{ matrix.harness }}
          path: .skill-eval-results/routing/${{ matrix.harness }}
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Aggregate catalog evidence
    needs: [matrix, eval, routing]
    if: always() && (needs.eval.result != 'skipped' || needs.routing.result != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download all eval evidence
        uses: actions/download-artifact@b14cf4c92620c250e1c074ab0a5800e37df86765 # v8.0.0
        with:
          pattern: skill-*
          path: evidence

      - name: Build catalog evidence index
        shell: bash
        env:
          SELECTED_SKILLS: ${{ needs.matrix.outputs.skills }}
          SELECTION_SCOPE: ${{ needs.matrix.outputs.scope }}
          ROUTING_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg selection_scope "${SELECTION_SCOPE}" \
            --argjson selected_skills "${SELECTED_SKILLS}" \
            --argjson routing_runs "${ROUTING_RUNS}" \
            '{
              schema_version: 1,
              generated_at: (now | todateiso8601),
              repository: $repository,
              commit: $commit,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              event: $event,
              selection: {
                scope: $selection_scope,
                skills: ($selected_skills | map(.project)),
                routing_runs_per_scenario: $routing_runs
              },
              harnesses: {
                claude: {runner: "@anthropic-ai/claude-code", version: "2.1.211", generation_model: "claude-haiku-4-5-20251001", judge_model: "claude-sonnet-4-6"},
                codex: {runner: "@openai/codex", version: "0.145.0", generation_model: "gpt-5.3-codex", judge_model: "gpt-5.3-codex"}
              }
            }' >catalog-eval-metadata.json
          mapfile -d '' files < <(
            find evidence -type f \( -name benchmark.json -o -name summary.json -o -name invalid-run.json \) \
              -print0 | sort -z
          )
          if (( ${#files[@]} == 0 )); then
            jq '. + {records: []}' catalog-eval-metadata.json \
              >catalog-eval-summary.json
          else
            jq -s --slurpfile metadata catalog-eval-metadata.json \
              '$metadata[0] + {records: .}' "${files[@]}" \
              >catalog-eval-summary.json
          fi
          jq '{commit, workflow_run_id, records: (.records | length)}' \
            catalog-eval-summary.json

      - name: Attest durable catalog evidence
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: catalog-eval-summary.json

      - name: Upload catalog summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-eval-catalog-summary
          path: catalog-eval-summary.json
          if-no-files-found: error
          retention-days: 90
