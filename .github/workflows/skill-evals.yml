name: Skill model evals

on:
  pull_request:
    paths:
      - ".github/workflows/skill-evals.yml"
      - ".moon/tasks/tag-skill.yml"
      - "packages/script/script-moon-common/**"
      - "packages/script/script-moon-ci-workflows/**"
      - "packages/script/script-moon-skill-eval-outputs/**"
      - "packages/script/script-moon-skill-eval-triggers/**"
      - "packages/skill/**"
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

concurrency:
  group: skill-model-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    name: Select skill evals
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.SKILL_EVALS_ENABLED == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.select.outputs.skills }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache-workspace: true

      - name: Build workflow orchestration
        run: nix develop --command bash -c "npm ci && npx moon run script-moon-ci-workflows:build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: select
        name: Select full or changed-skill matrix
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          args=(packages/skill)
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            args+=(--changed "${BASE_SHA}" "${HEAD_SHA}")
          fi
          skills="$(nix develop --command npx moon-ci-workflows skill-eval-matrix "${args[@]}")"
          printf 'skills=%s\n' "${skills}" >>"${GITHUB_OUTPUT}"

  eval:
    name: ${{ matrix.skill.package }} ${{ matrix.mode }} eval
    needs: matrix
    if: needs.matrix.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [trigger, output]
        skill: ${{ fromJSON(needs.matrix.outputs.skills) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cache-workspace: true

      - name: Require model-eval credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$ANTHROPIC_API_KEY"

      - name: Install repository dependencies
        run: nix develop --command npm ci

      - name: Build workflow orchestration
        run: nix develop --command npx moon run script-moon-ci-workflows:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Claude Code evaluator
        run: nix develop --command npm install --no-save @anthropic-ai/claude-code@2.1.211

      - name: Run skill evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ matrix.mode }}
          SKILL_PACKAGE: ${{ matrix.skill.package }}
          SKILL_GUIDE: ${{ matrix.skill.guide }}
        run: >-
          nix develop --command npx moon-ci-workflows skill-eval-run
          "$MODE" "$SKILL_PACKAGE" "$SKILL_GUIDE"
          --repository-root "$GITHUB_WORKSPACE"
          --temporary-root "$RUNNER_TEMP"

      - name: Upload benchmark evidence
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-eval-${{ matrix.skill.package }}-${{ matrix.mode }}
          path: .skill-eval-results/${{ matrix.skill.package }}/${{ matrix.mode }}
          if-no-files-found: warn
          retention-days: 30
