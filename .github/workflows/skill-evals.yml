name: Skill evaluation canary

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      harness:
        description: "Evaluation harness"
        type: choice
        options:
          - claude
          - codex
        default: claude

concurrency:
  group: skill-evaluation-canary
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  composition-canary:
    name: Composition skills
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Require harness credentials
        shell: bash
        run: |
          set -euo pipefail
          case "$SKILL_EVAL_HARNESS" in
            claude) test -n "$ANTHROPIC_API_KEY" ;;
            codex) test -n "$OPENAI_API_KEY" ;;
          esac
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKILL_EVAL_HARNESS: ${{ inputs.harness || 'claude' }}

      - name: Run routing and output canaries
        run: |
          nix develop --no-update-lock-file --command npm ci
          nix develop --no-update-lock-file --command npx moon run \
            skill-skill:ci-skill-eval-trigger \
            skill-command:ci-skill-eval-trigger \
            skill-workflow:ci-skill-eval-trigger \
            skill-skill:ci-skill-eval-output \
            skill-command:ci-skill-eval-output \
            skill-workflow:ci-skill-eval-output
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKILL_EVAL_HARNESS: ${{ inputs.harness || 'claude' }}
