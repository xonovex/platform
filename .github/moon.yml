$schema: https://moonrepo.dev/schemas/project.json
language: unknown
layer: configuration
tags:
  - ci
tasks:
  github-actions-lint:
    command:
      - zizmor
      - --offline
      - .
    toolchain: [system, nix]
    inputs:
      - "**/*"
      - /flake.lock
      - /flake.nix
      - /nix/ci.nix
    options:
      cache: true
  # Both nix tasks evaluate the flake, which resolves and may fetch its inputs,
  # so they belong to ci-integration rather than the side-effect-free ci-check.
  nix-flake-check:
    command:
      - nix
      - flake
      - check
      - --no-update-lock-file
      - --print-build-logs
    toolchain: [system, nix]
    inputs:
      - /flake.lock
      - /flake.nix
      - /nix/**/*
    options:
      cache: true
      runFromWorkspaceRoot: true
      runInCI: false
  nix-flake-eval-all-systems:
    command:
      - nix
      - flake
      - show
      - --all-systems
      - --json
      - --no-update-lock-file
    inputs:
      - /flake.lock
      - /flake.nix
      - /nix/**/*
    options:
      cache: true
      runFromWorkspaceRoot: true
      runInCI: false
  ci-check:
    command: noop
    deps:
      - github-actions-lint
    options:
      cache: false
  ci-integration:
    command: noop
    deps:
      - nix-flake-check
      - nix-flake-eval-all-systems
    options:
      cache: false
      runInCI: false
