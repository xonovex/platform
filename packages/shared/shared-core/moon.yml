$schema: https://moonrepo.dev/schemas/project.json
tasks:
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps: [coverage]
  ts-build:
    deps:
      - ^:build
      - vitest-config-node:build
      - eslint-config-cli:build
      - ts-config-cli:build
language: typescript
dependsOn: []
tags:
  - npm
  - scripts
  - typescript
layer: library
