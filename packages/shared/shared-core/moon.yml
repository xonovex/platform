$schema: https://moonrepo.dev/schemas/project.json
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "100"
      TS_COVERAGE_MIN_FUNCTIONS: "100"
      TS_COVERAGE_MIN_BRANCHES: "100"
      TS_COVERAGE_MIN_STATEMENTS: "100"
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps: [coverage]
  ts-build:
    deps:
      - ^:build
      - vitest-config-node:build
      - eslint-config-cli:build
      - ts-config-cli:build
language: typescript
dependsOn: []
tags:
  - npm
  - scripts
  - typescript
layer: library
