$schema: https://moonrepo.dev/schemas/project.json
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/prettier-config/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/config/vitest-config-base/src/**/*
    - /packages/config/vitest-config-node/src/**/*
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "100"
      TS_COVERAGE_MIN_FUNCTIONS: "100"
      TS_COVERAGE_MIN_BRANCHES: "100"
      TS_COVERAGE_MIN_STATEMENTS: "100"
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps: [coverage]
  ts-build:
    deps:
      - ^:build
      - vitest-config-node:build
      - eslint-config-cli:build
      - ts-config-cli:build
language: typescript
dependsOn: []
tags:
  - npm
  - scripts
  - typescript
layer: library
