$schema: https://moonrepo.dev/schemas/project.json
tags:
  - go
  - shared
language: go
layer: library
dependsOn:
  - shared-core-go
tasks:
  go-package-coverage:
    command: >-
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh"
      ./pkg/agents=90
      ./pkg/providers=90
      ./pkg/workspace=100
    inputs:
      - /packages/shared/shared-agent-go/pkg/agents/**/*.go
      - /packages/shared/shared-agent-go/pkg/providers/**/*.go
      - /packages/shared/shared-agent-go/pkg/workspace/**/*.go
      - /packages/shared/shared-agent-go/go.mod
      - /packages/shared/shared-agent-go/go.sum
      - /packages/shared/shared-core-go/**/*.go
      - /packages/shared/shared-core-go/go.mod
      - /packages/shared/shared-core-go/go.sum
      - /.moon/scripts/check-go-package-coverage.sh
    options:
      cache: true
      runInCI: true
  coverage:
    deps:
      - go-package-coverage
