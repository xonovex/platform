$schema: https://moonrepo.dev/schemas/project.json
language: go
layer: application
tags:
  - go
  - typescript
  - npm
  - cli
dependsOn:
  - shared-agent-go
  - shared-core-go
  - id: eslint-config-cli
    scope: development
  - id: ts-config-cli
    scope: development
  - id: vitest-config-node
    scope: development
fileGroups:
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/config/vitest-config-base/src/**/*
    - /packages/config/vitest-config-node/src/**/*
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "80"
  ts-build:
    script: npx tsc -p tsconfig.build.json
    deps:
      - eslint-config-cli:build
      - ts-config-cli:build
    inputs:
      - src/**/*.ts
      - tsconfig*.json
    outputs:
      - dist
  ts-lint:
    script: npx eslint src
    deps:
      - eslint-config-cli:build
    inputs:
      - src/**/*.ts
  ts-test:
    command: [npx, vitest, run]
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    options:
      cache: true
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "75"
      TS_COVERAGE_MIN_FUNCTIONS: "60"
      TS_COVERAGE_MIN_BRANCHES: "90"
      TS_COVERAGE_MIN_STATEMENTS: "75"
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    outputs:
      - coverage
  go-package-coverage:
    script: |
      set -euo pipefail
      # Every package the module builds is named here. cmd/agent-cli is process
      # wiring covered by go-integration against the real binary; the shared
      # packages declare interfaces and hold no statements. The workspace variants
      # run their commands through the shared Runner port, so the default tier
      # covers the logic with recorded output; what is left uncovered in
      # workspace/shared is the exec plumbing itself, which only the integration
      # tier can reach.
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh" \
        ./cmd/agent-cli=exempt \
        ./internal/cmd=70 \
        ./internal/config=65 \
        ./internal/network/shared=80 \
        ./internal/provision/command=100 \
        ./internal/provision/nix=85 \
        ./internal/provision/none=100 \
        ./internal/provision/shared=exempt \
        ./internal/isolation/bwrap=80 \
        ./internal/isolation/docker=78 \
        ./internal/isolation/none=85 \
        ./internal/isolation/shared=80 \
        ./internal/sandbox=95 \
        ./internal/sandbox/plugins=100 \
        ./internal/terminal=100 \
        ./internal/terminal/shared=exempt \
        ./internal/terminal/tmux=75 \
        ./internal/workspace/git=87 \
        ./internal/workspace/jj=91 \
        ./internal/workspace/shared=66
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
      - /.moon/scripts/strip-generated-coverage.sh
    options:
      cache: true
    toolchain: [system, nix]
  go-integration:
    script: |
      set -euo pipefail
      version="$(node -p "require('./package.json').version")"
      binary="$projectRoot/dist/agent-cli"
      go build -ldflags="-s -w -X github.com/xonovex/platform/packages/agent/agent-cli-go/internal/cmd.version=$version" -o "$binary" ./cmd/agent-cli
      AGENT_CLI_BINARY="$binary" AGENT_CLI_VERSION="$version" go test -tags=integration ./test/integration/ ./internal/...
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - package.json
      - go.mod
      - go.sum
    options:
      cache: false
      runInCI: false
    toolchain: [system, nix]
  coverage:
    command: noop
    deps:
      - go-test-coverage
      - go-package-coverage
      - ts-coverage
    options:
      cache: false
      mergeDeps: replace
  ci-check:
    script: echo 'ci-check complete'
    deps:
      - build
      - lint
      - typecheck
      - test
      - coverage
      - format-check
      - npm-check
    options:
      cache: false
      mergeDeps: replace
  # go-integration builds the real binary and executes it, and the internal
  # packages behind the integration build tag drive git, jj, bwrap and bash, so
  # this is an integration tier rather than a ci-check gate.
  ci-integration:
    command: noop
    deps:
      - go-integration
    options:
      cache: false
      runInCI: false
  ci-publish:
    script: echo 'ci-publish complete'
    deps:
      - npm-publish
      - agent-cli-go-github:ci-publish
    options:
      cache: false
