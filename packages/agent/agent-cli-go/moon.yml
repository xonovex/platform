$schema: https://moonrepo.dev/schemas/project.json
language: go
layer: application
tags:
  - go
  - typescript
  - npm
  - cli
dependsOn:
  - shared-agent-go
  - shared-core-go
  - id: eslint-config-cli
    scope: development
  - id: ts-config-cli
    scope: development
  - id: vitest-config-node
    scope: development
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "75"
  ts-build:
    script: npx tsc
    deps:
      - eslint-config-cli:build
      - ts-config-cli:build
    inputs:
      - src/**/*.ts
      - tsconfig.json
    outputs:
      - dist
  ts-lint:
    script: npx eslint src
    deps:
      - eslint-config-cli:build
    inputs:
      - src/**/*.ts
  ts-test:
    command: [npx, vitest, run]
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    options:
      cache: true
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "75"
      TS_COVERAGE_MIN_FUNCTIONS: "60"
      TS_COVERAGE_MIN_BRANCHES: "90"
      TS_COVERAGE_MIN_STATEMENTS: "75"
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    outputs:
      - coverage
  go-package-coverage:
    script: >-
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh"
      ./internal/cmd=70
      ./internal/config=60
      ./internal/network/shared=80
      ./internal/provision/command=100
      ./internal/provision/nix=80
      ./internal/provision/none=100
      ./internal/isolation/bwrap=65
      ./internal/isolation/docker=65
      ./internal/isolation/none=80
      ./internal/isolation/shared=80
      ./internal/sandbox=95
      ./internal/sandbox/plugins=100
      ./internal/terminal=100
      ./internal/terminal/tmux=75
      ./internal/workspace/git=80
      ./internal/workspace/jj=90
      ./internal/workspace/shared=55
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
    options:
      cache: true
    toolchain: [system, nix]
  go-integration:
    script: |
      set -euo pipefail
      version="$(node -p "require('./package.json').version")"
      binary="$projectRoot/dist/agent-cli"
      go build -ldflags="-s -w -X github.com/xonovex/platform/packages/agent/agent-cli-go/internal/cmd.version=$version" -o "$binary" ./cmd/agent-cli
      AGENT_CLI_BINARY="$binary" AGENT_CLI_VERSION="$version" go test -tags=integration ./test/integration/
    inputs:
      - "@globs(sources)"
      - test/integration/**/*.go
      - package.json
      - go.mod
      - go.sum
    options:
      cache: false
    toolchain: [system, nix]
  coverage:
    command: noop
    deps:
      - go-test-coverage
      - go-package-coverage
      - ts-coverage
    options:
      cache: false
      mergeDeps: replace
  ci-check:
    script: echo 'ci-check complete'
    deps:
      - build
      - lint
      - typecheck
      - test
      - coverage
      - format-check
      - npm-check
      - go-integration
    options:
      cache: false
      mergeDeps: replace
  ci-publish:
    script: echo 'ci-publish complete'
    deps:
      - npm-publish
      - agent-cli-go-github:ci-publish
    options:
      cache: false
