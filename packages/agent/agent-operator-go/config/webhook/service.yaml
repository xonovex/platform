apiVersion: v1
kind: Service
metadata:
  name: agent-operator-webhook-service
  namespace: system
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/component: webhook
spec:
  selector:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/component: manager
  ports:
    - name: webhook
      port: 443
      protocol: TCP
      targetPort: webhook
