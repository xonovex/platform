apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentschedules.agent.xonovex.com
spec:
  group: agent.xonovex.com
  names:
    kind: AgentSchedule
    listKind: AgentScheduleList
    plural: agentschedules
    singular: agentschedule
    shortNames: [ags]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Suspend
          type: boolean
          jsonPath: .spec.suspend
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [schedule, template]
              properties:
                schedule:
                  type: string
                  minLength: 1
                suspend:
                  type: boolean
                concurrencyPolicy:
                  type: string
                  enum: [Allow, Forbid, Replace]
                template:
                  type: object
                  required: [spec]
                  properties:
                    metadata:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
