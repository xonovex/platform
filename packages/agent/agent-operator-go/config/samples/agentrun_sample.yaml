apiVersion: agent.xonovex.com/v1alpha1
kind: AgentRun
metadata:
  name: agentrun-sample
  namespace: default
spec:
  harness:
    type: claude
  providerRef: anthropic-provider
  image: ghcr.io/example/agents/claude@sha256:<digest>
  runtimeClassName: kata
  workspace:
    type: git
    repository:
      url: https://github.com/example/repo.git
      branch: main
  prompt: "Review the codebase and suggest improvements"
  network: none
  timeout: 30m
  # For Confidential Computing (AMD SEV-SNP), replace runtimeClassName with kata-cc:
  # nodeSelector:
  #   kubernetes.azure.com/confidential-computing: "true"  # AKS example
  # For Confidential Computing (Intel TDX):
  # runtimeClassName: kata-tdx
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
      ephemeral-storage: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
      ephemeral-storage: "5Gi"
