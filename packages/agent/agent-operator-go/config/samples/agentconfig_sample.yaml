apiVersion: agent.xonovex.com/v1alpha1
kind: AgentConfig
metadata:
  name: default
  namespace: default
spec:
  defaultAgent: claude
  defaultProviders:
    claude: anthropic-provider
  defaultImage: "ghcr.io/example/agents/claude@sha256:<digest>"
  defaultTimeout: 1h
  storageClass: standard
  storageSize: 10Gi
