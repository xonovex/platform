apiVersion: agent.xonovex.com/v1alpha1
kind: AgentPolicy
metadata:
  name: enterprise-policy
  namespace: ai-agents
spec:
  enforced:
    runtimeClassName: kata
    requireSecurityContext: true
    requireNetworkPolicy: true
    requireEgressRestricted: true
    maxTimeout: 2h0m0s
    maxResources:
      cpu: "2"
      memory: 4Gi
    allowedImages:
      - ghcr.io/your-org/
      - ghcr.io/xonovex/
    allowedRuntimeClassNames:
      - kata
      - gvisor
  defaults:
    image: ghcr.io/xonovex/agent-image@sha256:<digest>
    timeout: 30m0s
    runtimeClassName: kata
