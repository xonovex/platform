apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: governance-decision-service
  namespace: agent-operator-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: governance-decision-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-operator-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-operator
              app.kubernetes.io/component: manager
      ports:
        - protocol: TCP
          port: 8787
