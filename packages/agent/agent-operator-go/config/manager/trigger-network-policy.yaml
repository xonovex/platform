apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-operator-trigger
  namespace: system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-operator
      app.kubernetes.io/component: manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 9443
    - from:
        - namespaceSelector:
            matchLabels:
              agent.xonovex.com/trigger-client: "true"
      ports:
        - protocol: TCP
          port: 8090
