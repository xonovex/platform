apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-operator-controller-manager
  namespace: system
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-operator
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-operator
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: agent-operator-controller-manager
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: ghcr.io/xonovex/agent-operator-go:0.1.30
          command:
            - /operator
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --decision-service-url=http://127.0.0.1:8787
            - --trigger-bind-address=:8090
            - --workspace-init-image=docker.io/alpine/git:2.54.0@sha256:697cb1c85aefc5724febaec2202a974e0d66f6abb6be91a9a86d0c8757af692a
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 8090
              name: trigger
              protocol: TCP
            - containerPort: 9443
              name: webhook
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
        - name: governance-decision
          image: ghcr.io/xonovex/governance-decision-service:0.1.0
          env:
            - name: DECISION_EVIDENCE_PATH
              value: /var/lib/xonovex/verdicts.jsonl
            - name: DECISION_ENFORCEMENT_PATH
              value: /var/lib/xonovex/enforcements.jsonl
            - name: DECISION_EVIDENCE_BASE_REFERENCE
              value: pvc://agent-operator-governance-evidence/verdicts.jsonl
            - name: DECISION_ENFORCEMENT_BASE_REFERENCE
              value: pvc://agent-operator-governance-evidence/enforcements.jsonl
          ports:
            - containerPort: 8787
              name: decision
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: governance-evidence
              mountPath: /var/lib/xonovex
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: governance-evidence
          persistentVolumeClaim:
            claimName: agent-operator-governance-evidence
        - name: webhook-cert
          secret:
            secretName: agent-operator-webhook-server-cert
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-operator-governance-evidence
  namespace: system
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/component: governance-evidence
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
