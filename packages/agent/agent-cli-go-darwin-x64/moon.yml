$schema: https://moonrepo.dev/schemas/project.json
id: agent-cli-go-darwin-x64
language: go
layer: unknown
tags:
  - npm
  - npm-platform
env:
  GOOS: darwin
  GOARCH: amd64
  CGO_ENABLED: "0"
  BIN_EXT: ""
tasks:
  go-build:
    script: |
      set -euo pipefail
      version="$(node -p "require('$workspaceRoot/packages/agent/agent-cli-go/package.json').version")"
      mkdir -p bin
      cd "$workspaceRoot/packages/agent/agent-cli-go"
      go build -ldflags="-s -w -X github.com/xonovex/platform/packages/agent/agent-cli-go/internal/cmd.version=$version" -o "$projectRoot/bin/agent-cli-go${BIN_EXT}" ./cmd/agent-cli
    inputs:
      - /packages/agent/agent-cli-go/**/*.go
      - /packages/agent/agent-cli-go/package.json
      - /packages/agent/agent-cli-go/go.mod
      - /packages/agent/agent-cli-go/go.sum
      - /packages/shared/shared-agent-go/**/*.go
      - /packages/shared/shared-agent-go/go.mod
      - /packages/shared/shared-core-go/**/*.go
      - /packages/shared/shared-core-go/go.mod
    outputs:
      - bin/
    options:
      cache: true
    toolchain: [system, nix]
  ci-check:
    command: echo 'ci-check complete'
    deps:
      - go-build
    options:
      cache: false
  npm-publish:
    deps:
      - go-build
    options:
      mergeDeps: prepend
