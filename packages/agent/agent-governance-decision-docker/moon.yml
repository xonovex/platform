$schema: https://moonrepo.dev/schemas/project.json
language: unknown
layer: application
tags:
  - docker
tasks:
  docker-build:
    command:
      - docker
      - build
      - -f
      - packages/agent/agent-governance-decision-docker/Dockerfile
      - -t
      - ghcr.io/xonovex/governance-decision-service:0.1.0
      - .
    inputs:
      - Dockerfile
      - runtime/package.json
      - runtime/package-lock.json
      - /packages/skill/skill-workflow/workflow-guide/scripts/*.ts
      - /packages/skill/skill-agent-governance/agent-governance-guide/scripts/*.ts
    outputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true
