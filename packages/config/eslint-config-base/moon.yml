$schema: https://moonrepo.dev/schemas/project.json
language: typescript
layer: configuration
tags:
  - npm
  - tenant-shared
  - typescript-config
dependsOn:
  - ts-config-node
tasks:
  ts-test:
    script: npx vitest run
    deps:
      - ^:build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs: []
    options:
      cache: true
      mergeDeps: replace
