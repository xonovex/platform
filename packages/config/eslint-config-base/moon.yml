$schema: https://moonrepo.dev/schemas/project.json
language: typescript
layer: configuration
tags:
  - npm
  - tenant-shared
  - typescript-config
dependsOn:
  - ts-config-node
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/prettier-config/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-node/src/**/*
tasks:
  ts-test:
    script: npx vitest run
    deps:
      - ^:build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs: []
    options:
      cache: true
      mergeDeps: replace
workspace:
  inheritedTasks:
    # A config package has no tests (ts-test is stubbed out), so a
    # coverage gate would measure nothing.
    exclude:
      - ts-coverage
