$schema: https://moonrepo.dev/schemas/project.json
language: typescript
layer: configuration
tags:
  - npm
  - tenant-shared
  - typescript-config
dependsOn:
  - vitest-config-base
  - eslint-config-base
  - ts-config-build
workspace:
  inheritedTasks:
    # A config package has no tests (ts-test is stubbed out), so a
    # coverage gate would measure nothing.
    exclude:
      - ts-coverage
