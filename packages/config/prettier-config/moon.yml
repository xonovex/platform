$schema: https://moonrepo.dev/schemas/project.json
language: typescript
layer: configuration
tags:
  - npm
  - tenant-shared
  - typescript-config
dependsOn:
  - eslint-config-base
  - ts-config-build
workspace:
  inheritedTasks:
    # A config package has no tests (ts-test is stubbed out), so a
    # coverage gate would measure nothing.
    exclude:
      - ts-coverage
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-node/src/**/*
