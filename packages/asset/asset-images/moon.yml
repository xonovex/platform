$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tasks:
  asset-check:
    # Every committed image is checked against its declared format.
    script: |
      set -euo pipefail
      shopt -s nullglob
      images=(*.png *.svg)
      if [ "${#images[@]}" -eq 0 ]; then
        echo 'No image assets found' >&2
        exit 1
      fi
      for image in "${images[@]}"; do
        mime=$(file --brief --mime-type "$image")
        case "$image" in
          *.png) expected='image/png' ;;
          *.svg) expected='image/svg+xml' ;;
        esac
        if [ "$mime" != "$expected" ]; then
          echo "$image has MIME type $mime; expected $expected" >&2
          exit 1
        fi
      done
    toolchain: [system, nix]
    inputs:
      - "*.png"
      - "*.svg"
    options:
      cache: true
  ci-check:
    command: noop
    deps: [asset-check]
    options:
      cache: false
