$schema: https://moonrepo.dev/schemas/v2/project.json
id: agent-eval-go-darwin-x64
language: go
layer: unknown
tags:
  - npm
env:
  GOOS: darwin
  GOARCH: amd64
  CGO_ENABLED: "0"
  BIN_EXT: ""
tasks:
  go-build:
    script: |
      set -euo pipefail
      version="$(node -p "require('$workspaceRoot/packages/tooling/cli/agent-eval-go/package.json').version")"
      mkdir -p bin
      cd "$workspaceRoot/packages/tooling/cli/agent-eval-go"
      go build -ldflags="-s -w -X github.com/xonovex/platform/packages/tooling/cli/agent-eval-go/internal/cmd.version=$version" -o "$projectRoot/bin/agent-eval-go${BIN_EXT}" ./cmd/agent-eval
    inputs:
      - /packages/tooling/cli/agent-eval-go/**/*.go
      - /packages/tooling/cli/agent-eval-go/package.json
      - /packages/tooling/cli/agent-eval-go/go.mod
      - /packages/tooling/cli/agent-eval-go/go.sum
      - /packages/library/*-go/**/*.go
      - /packages/library/*-go/**/*.json
      - /packages/library/*-go/go.mod
      - /packages/library/*-go/go.sum
    outputs:
      - bin/
    options:
      cache: true
  ci-check:
    command: echo 'ci-check complete'
    deps:
      - go-build
    options:
      cache: false
  npm-publish:
    deps:
      - go-build
    options:
      mergeDeps: prepend
