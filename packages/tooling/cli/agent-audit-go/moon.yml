$schema: https://moonrepo.dev/schemas/v2/project.json
language: go
layer: application
tags:
  - go
  - cli
dependsOn:
  - shared-contract-go
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "92"
  go-package-coverage:
    script: |
      set -euo pipefail
      # Every package the module builds is named here. cmd/agent-audit is the
      # composition root, internal/process/osexec and internal/web/nethttp are
      # the host adapters; go-integration covers all three, because a unit test
      # may not start a process or open a socket. internal/web declares an
      # interface and holds no statements. Every other package reaches the
      # machine through a port, so the unit tier covers it with the memory file
      # system, processtest and webtest.
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh" \
        ./cmd/agent-audit=exempt \
        ./internal/audit=100 \
        ./internal/catalogs=100 \
        ./internal/cmd=96 \
        ./internal/compare=100 \
        ./internal/compare/gitbase=100 \
        ./internal/gitfs=100 \
        ./internal/legacy=98 \
        ./internal/observe=100 \
        ./internal/process=exempt \
        ./internal/process/osexec=exempt \
        ./internal/process/processtest=100 \
        ./internal/render=100 \
        ./internal/rules=100 \
        ./internal/stamp=97 \
        ./internal/transport/filesystem=100 \
        ./internal/transport/git=99 \
        ./internal/transport/http=100 \
        ./internal/transport/plugins=100 \
        ./internal/web=exempt \
        ./internal/web/nethttp=exempt \
        ./internal/web/webtest=100
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
      - /.moon/scripts/strip-generated-coverage.sh
    options:
      cache: true
      runInCI: true
  coverage:
    deps:
      - go-package-coverage
  # The architecture tests read the source tree, so they carry the arch build
  # tag and run here instead of in go-test.
  go-test-arch:
    command:
      - go
      - test
      - -tags=arch
      - ./internal/arch/
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  test:
    command: noop
    deps:
      - go-test
      - go-test-arch
    options:
      cache: false
      mergeDeps: replace
  # The skill and plugin tasks of the repository run this binary, so moon builds
  # it once, caches it with its output, and restores it before a dependent task.
  binary:
    script: |
      set -euo pipefail
      go build -o "$projectRoot/dist/agent-audit" ./cmd/agent-audit
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - go.mod
      - go.sum
    outputs:
      - dist/agent-audit
    options:
      cache: true
  # go-integration builds the real binary, runs it against a temporary
  # directory, a real git repository and an httptest server, and converts every
  # sources.json of the plugins, so it is an integration tier rather than a
  # ci-check gate.
  go-integration:
    script: |
      set -euo pipefail
      binary="$projectRoot/dist/agent-audit"
      go build -o "$binary" ./cmd/agent-audit
      AGENT_AUDIT_BINARY="$binary" go test -tags=integration ./test/integration/
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - go.mod
      - go.sum
      - /packages/runtime/plugin/**/sources.json
    options:
      cache: false
      runInCI: false
  ci-integration:
    command: noop
    deps:
      - go-integration
    options:
      cache: false
      runInCI: false
