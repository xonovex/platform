$schema: https://moonrepo.dev/schemas/v2/project.json
id: agent-validate-go-linux-x64
language: go
layer: unknown
tags:
  - npm
env:
  GOOS: linux
  GOARCH: amd64
  CGO_ENABLED: "0"
  BIN_EXT: ""
tasks:
  go-build:
    script: |
      set -euo pipefail
      version="$(node -p "require('$workspaceRoot/packages/tooling/cli/agent-validate-go/package.json').version")"
      mkdir -p bin
      cd "$workspaceRoot/packages/tooling/cli/agent-validate-go"
      go build -ldflags="-s -w -X main.version=$version" -o "$projectRoot/bin/agent-validate-go${BIN_EXT}" ./cmd/agent-validate
    inputs:
      - /packages/tooling/cli/agent-validate-go/**/*.go
      - /packages/tooling/cli/agent-validate-go/package.json
      - /packages/tooling/cli/agent-validate-go/go.mod
      - /packages/tooling/cli/agent-validate-go/go.sum
      - /packages/library/shared-contract-go/**/*.go
      - /packages/library/shared-contract-go/**/*.schema.json
      - /packages/library/shared-contract-go/go.mod
      - /packages/library/shared-contract-go/go.sum
    outputs:
      - bin/
    options:
      cache: true
  ci-check:
    command: echo 'ci-check complete'
    deps:
      - go-build
    options:
      cache: false
  npm-publish:
    deps:
      - go-build
    options:
      mergeDeps: prepend
