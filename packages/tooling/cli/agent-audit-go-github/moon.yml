$schema: https://moonrepo.dev/schemas/v2/project.json
tags: [shell]
tasks:
  build:
    script: bash scripts/build-archives.sh "$workspaceRoot/packages/tooling/cli" "$projectRoot/release-assets"
    deps:
      - agent-audit-go-darwin-arm64:go-build
      - agent-audit-go-darwin-x64:go-build
      - agent-audit-go-linux-arm64:go-build
      - agent-audit-go-linux-x64:go-build
      - agent-audit-go-win32-x64:go-build
    inputs: []
    outputs:
      - release-assets/
    options:
      cache: true
  github-publish:
    script: bash scripts/github-release.sh "$workspaceRoot/packages/tooling/cli/agent-audit-go" "$projectRoot/release-assets"
    deps:
      - build
    options:
      cache: false
      runInCI: true
  github-check:
    script: bash scripts/github-release.sh "$workspaceRoot/packages/tooling/cli/agent-audit-go" "$projectRoot/release-assets" --dry-run
    deps:
      - build
    options:
      cache: false
  ci-check:
    deps:
      - github-check
  ci-publish:
    command: echo 'ci-publish complete'
    deps:
      - github-publish
    options:
      cache: false
      runInCI: true
  ci-publish-dry-run:
    command: echo 'ci-publish-dry-run complete'
    deps:
      - github-check
    options:
      cache: false
      runInCI: true
language: bash
dependsOn: []
layer: unknown
