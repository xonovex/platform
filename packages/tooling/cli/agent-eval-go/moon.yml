$schema: https://moonrepo.dev/schemas/v2/project.json
language: go
layer: application
tags:
  - go
  - typescript
  - npm
  - cli
dependsOn:
  - shared-config-go
  - shared-contract-go
  - shared-core-go
  - id: eslint-config-cli
    scope: development
  - id: ts-config-cli
    scope: development
  - id: vitest-config-node
    scope: development
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/config/vitest-config-base/src/**/*
    - /packages/config/vitest-config-node/src/**/*
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "94"
  go-package-coverage:
    script: |
      set -euo pipefail
      # Every package the module builds is named here. cmd/agent-eval is the
      # composition root that binds the host adapters of the shared libraries;
      # go-integration covers it, because a unit test may not start a process or
      # touch the disk. Every other package reaches the machine through a port,
      # so the unit tier covers it with memfs, processtest, scratchtest and
      # protocoltest.
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh" \
        ./cmd/agent-eval=exempt \
        ./internal/ablation=100 \
        ./internal/baseline=97 \
        ./internal/budget=100 \
        ./internal/catalog=94 \
        ./internal/cmd=92 \
        ./internal/cost=96 \
        ./internal/document=98 \
        ./internal/execute=92 \
        ./internal/harness=100 \
        ./internal/harness/claude=96 \
        ./internal/harness/codex=100 \
        ./internal/judge=100 \
        ./internal/migrate=91 \
        ./internal/model=100 \
        ./internal/predicate=100 \
        ./internal/predicate/filesystem=100 \
        ./internal/predicate/llm=100 \
        ./internal/predicate/session=100 \
        ./internal/protocol=98 \
        ./internal/protocol/instruction=100 \
        ./internal/protocol/orchestration=96 \
        ./internal/protocol/output=98 \
        ./internal/protocol/protocoltest=exempt \
        ./internal/protocol/routing=98 \
        ./internal/protocol/trigger=100 \
        ./internal/registry=100 \
        ./internal/report=100 \
        ./internal/run=98 \
        ./internal/settings=95 \
        ./internal/store=96
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
      - /.moon/scripts/strip-generated-coverage.sh
    options:
      cache: true
      runInCI: true
  coverage:
    deps:
      - go-package-coverage
      - ts-coverage
  # The architecture tests read the source tree, so they carry the arch build
  # tag and run here instead of in go-test.
  go-test-arch:
    command:
      - go
      - test
      - -tags=arch
      - ./internal/arch/
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  test:
    command: noop
    deps:
      - go-test
      - go-test-arch
      - ts-test
    options:
      cache: false
      mergeDeps: replace
  # The skill and plugin tasks of the repository run this binary, so moon builds
  # it once, caches it with its output, and restores it before a dependent task.
  binary:
    script: |
      set -euo pipefail
      go build -o "$projectRoot/dist/agent-eval" ./cmd/agent-eval
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - go.mod
      - go.sum
    outputs:
      - dist/agent-eval
    options:
      cache: true
  # go-integration builds the real binary and runs it against a temporary
  # directory and a fake claude program on PATH, and reads every eval
  # file of the plugins, so it is an integration tier rather than a ci-check
  # gate. It starts real processes and spends no model budget.
  go-integration:
    script: |
      set -euo pipefail
      binary="$projectRoot/dist/agent-eval"
      go build -o "$binary" ./cmd/agent-eval
      AGENT_EVAL_BINARY="$binary" go test -tags=integration ./test/integration/
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - go.mod
      - go.sum
      - /packages/runtime/plugin/**/eval-trigger.json
      - /packages/runtime/plugin/**/eval-output.json
    options:
      cache: false
      runInCI: false
  ci-integration:
    command: noop
    deps:
      - go-integration
    options:
      cache: false
      runInCI: false
  ts-build:
    script: npx tsc -p tsconfig.build.json
    deps:
      - eslint-config-cli:build
      - ts-config-cli:build
    inputs:
      - src/**/*.ts
      - tsconfig*.json
    outputs:
      - dist
  ts-lint:
    script: npx eslint src
    deps:
      - eslint-config-cli:build
    inputs:
      - src/**/*.ts
  ts-test:
    command: [npx, vitest, run]
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    options:
      cache: true
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "75"
      TS_COVERAGE_MIN_FUNCTIONS: "60"
      TS_COVERAGE_MIN_BRANCHES: "90"
      TS_COVERAGE_MIN_STATEMENTS: "75"
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    outputs:
      - coverage
  ci-check:
    script: echo 'ci-check complete'
    deps:
      - build
      - lint
      - typecheck
      - test
      - coverage
      - format-check
      - npm-check
    options:
      cache: false
      mergeDeps: replace
  # The launcher resolves these exact versions at install time, so they
  # reach the registry first.
  npm-publish:
    deps:
      - agent-eval-go-darwin-arm64:npm-publish
      - agent-eval-go-darwin-x64:npm-publish
      - agent-eval-go-linux-arm64:npm-publish
      - agent-eval-go-linux-x64:npm-publish
      - agent-eval-go-win32-x64:npm-publish
    options:
      mergeDeps: append
  ci-publish:
    script: echo 'ci-publish complete'
    deps:
      - npm-publish
      - agent-eval-go-github:ci-publish
    options:
      cache: false
