$schema: https://moonrepo.dev/schemas/v2/project.json
language: go
layer: application
tags:
  - go
  - typescript
  - npm
  - cli
dependsOn:
  - shared-agent-go
  - shared-core-go
  - id: eslint-config-cli
    scope: development
  - id: ts-config-cli
    scope: development
  - id: vitest-config-node
    scope: development
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/config/vitest-config-base/src/**/*
    - /packages/config/vitest-config-node/src/**/*
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "80"
  ts-build:
    script: npx tsc -p tsconfig.build.json
    deps:
      - eslint-config-cli:build
      - ts-config-cli:build
    inputs:
      - src/**/*.ts
      - tsconfig*.json
    outputs:
      - dist
  ts-lint:
    script: npx eslint src
    deps:
      - eslint-config-cli:build
    inputs:
      - src/**/*.ts
  ts-test:
    command: [npx, vitest, run]
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    options:
      cache: true
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "75"
      TS_COVERAGE_MIN_FUNCTIONS: "60"
      TS_COVERAGE_MIN_BRANCHES: "90"
      TS_COVERAGE_MIN_STATEMENTS: "75"
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    outputs:
      - coverage
  go-package-coverage:
    script: |
      set -euo pipefail
      # Every package the module builds is named here. cmd/agent-cli is the
      # composition root and internal/system the operating-system adapter; both
      # are covered by go-integration, because a unit test may not start a
      # process or touch a file. The shared package of provision declares
      # interfaces and holds no statements. Every other package reaches
      # the machine through a port, so the unit tier covers it with
      # internal/system/systemtest.
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh" \
        ./cmd/agent-cli=exempt \
        ./internal/cmd=97 \
        ./internal/config=100 \
        ./internal/credential/env=100 \
        ./internal/credential/file=100 \
        ./internal/credential/keychain=100 \
        ./internal/credential/pass=100 \
        ./internal/credential/secretservice=100 \
        ./internal/credential/shared=100 \
        ./internal/launch=99 \
        ./internal/network/managed=100 \
        ./internal/network/shared=100 \
        ./internal/origin=exempt \
        ./internal/origin/directory=100 \
        ./internal/origin/git=100 \
        ./internal/origin/plugins=100 \
        ./internal/origin/shared=100 \
        ./internal/overlay=100 \
        ./internal/plugin=100 \
        ./internal/trust=100 \
        ./internal/provision/command=100 \
        ./internal/provision/nix=99 \
        ./internal/provision/none=100 \
        ./internal/provision/shared=exempt \
        ./internal/record=100 \
        ./internal/isolation/bwrap=98 \
        ./internal/isolation/docker=98 \
        ./internal/isolation/dockersandboxes=96 \
        ./internal/isolation/none=100 \
        ./internal/isolation/openshell=99 \
        ./internal/isolation/seatbelt=96 \
        ./internal/isolation/shared=96 \
        ./internal/sandbox=97 \
        ./internal/sandbox/plugins=100 \
        ./internal/schematest=92 \
        ./internal/system=exempt \
        ./internal/system/systemtest=99 \
        ./internal/terminal/herdr=100 \
        ./internal/terminal/shared=100 \
        ./internal/terminal/tmux=100 \
        ./internal/workspace/git=98 \
        ./internal/workspace/jj=100 \
        ./internal/workspace/shared=100
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
      - /.moon/scripts/strip-generated-coverage.sh
    options:
      cache: true
  go-integration:
    script: |
      set -euo pipefail
      version="$(node -p "require('./package.json').version")"
      binary="$projectRoot/dist/agent-cli"
      go build -ldflags="-s -w -X github.com/xonovex/platform/packages/tooling/cli/agent-cli-go/internal/cmd.version=$version" -o "$binary" ./cmd/agent-cli
      AGENT_CLI_BINARY="$binary" AGENT_CLI_VERSION="$version" go test -tags=integration ./test/integration/ ./internal/...
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - package.json
      - go.mod
      - go.sum
    options:
      cache: false
      runInCI: false
  coverage:
    command: noop
    deps:
      - go-test-coverage
      - go-package-coverage
      - ts-coverage
    options:
      cache: false
      mergeDeps: replace
  ci-check:
    script: echo 'ci-check complete'
    deps:
      - build
      - lint
      - typecheck
      - test
      - coverage
      - format-check
      - npm-check
    options:
      cache: false
      mergeDeps: replace
  # go-integration builds the real binary and executes it, and the internal
  # packages behind the integration build tag drive git, jj, bwrap and bash, so
  # this is an integration tier rather than a ci-check gate.
  ci-integration:
    command: noop
    deps:
      - go-integration
    options:
      cache: false
      runInCI: false
  # The launcher resolves these exact versions at install time, so they
  # reach the registry first.
  npm-publish:
    deps:
      - agent-cli-go-darwin-arm64:npm-publish
      - agent-cli-go-darwin-x64:npm-publish
      - agent-cli-go-linux-arm64:npm-publish
      - agent-cli-go-linux-x64:npm-publish
      - agent-cli-go-win32-x64:npm-publish
    options:
      mergeDeps: append
  ci-publish:
    script: echo 'ci-publish complete'
    deps:
      - npm-publish
      - agent-cli-go-github:ci-publish
    options:
      cache: false
