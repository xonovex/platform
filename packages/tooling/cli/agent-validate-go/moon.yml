$schema: https://moonrepo.dev/schemas/v2/project.json
language: go
layer: application
tags:
  - go
  - typescript
  - npm
  - cli
dependsOn:
  - shared-contract-go
  - id: eslint-config-cli
    scope: development
  - id: ts-config-cli
    scope: development
  - id: vitest-config-node
    scope: development
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/config/vitest-config-base/src/**/*
    - /packages/config/vitest-config-node/src/**/*
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "92"
  go-package-coverage:
    script: |
      set -euo pipefail
      # Every package the module builds is named here. cmd/agent-validate is the
      # composition root that binds the disk, the schema engine and git, so
      # go-integration covers it. internal/checktest is test support and
      # internal/arch holds only architecture tests behind a build tag. Every
      # other package reaches the machine through a port, so the unit tier
      # covers it over an in-memory file system.
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh" \
        ./cmd/agent-validate=exempt \
        ./internal/arch=exempt \
        ./internal/budget=100 \
        ./internal/catalog=100 \
        ./internal/check=100 \
        ./internal/check/agent=91 \
        ./internal/check/command=96 \
        ./internal/check/drift=93 \
        ./internal/check/hook=97 \
        ./internal/check/instructions=91 \
        ./internal/check/kit=92 \
        ./internal/check/links=85 \
        ./internal/check/llms=93 \
        ./internal/check/marketplace=93 \
        ./internal/check/outputstyle=86 \
        ./internal/check/plugin=91 \
        ./internal/check/repository=89 \
        ./internal/check/routing=94 \
        ./internal/check/schema=92 \
        ./internal/check/skill=93 \
        ./internal/check/sources=90 \
        ./internal/check/text=93 \
        ./internal/check/workspace=93 \
        ./internal/checktest=exempt \
        ./internal/cmd=94 \
        ./internal/component=100 \
        ./internal/document=100 \
        ./internal/gitrepo=100 \
        ./internal/glob=100 \
        ./internal/markdown=99 \
        ./internal/project=95 \
        ./internal/registry=100 \
        ./internal/report=100 \
        ./internal/runner=100 \
        ./internal/tree=94
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
      - /.moon/scripts/strip-generated-coverage.sh
    options:
      cache: true
      runInCI: true
  coverage:
    deps:
      - go-package-coverage
      - ts-coverage
  # The architecture tests read the source tree, so they carry the arch build
  # tag and run here instead of in go-test.
  go-test-arch:
    command:
      - go
      - test
      - -tags=arch
      - ./internal/arch/
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  test:
    command: noop
    deps:
      - go-test
      - go-test-arch
      - ts-test
    options:
      cache: false
      mergeDeps: replace
  # The skill and plugin tasks of the repository run this binary, so moon builds
  # it once, caches it with its output, and restores it before a dependent task.
  binary:
    script: |
      set -euo pipefail
      go build -o "$projectRoot/dist/agent-validate" ./cmd/agent-validate
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - go.mod
      - go.sum
    outputs:
      - dist/agent-validate
    options:
      cache: true
  # go-integration builds the real binary and runs it over this repository and
  # over temporary repositories, so it is an integration tier rather than a
  # ci-check gate.
  go-integration:
    script: |
      set -euo pipefail
      binary="$projectRoot/dist/agent-validate"
      go build -o "$binary" ./cmd/agent-validate
      AGENT_VALIDATE_BINARY="$binary" go test -tags=integration -v ./test/integration/
    deps:
      - ^:go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - go.mod
      - go.sum
      - /agentic.validate.json
    options:
      cache: false
      runInCI: false
  ci-integration:
    command: noop
    deps:
      - go-integration
    options:
      cache: false
      runInCI: false
  ts-build:
    script: npx tsc -p tsconfig.build.json
    deps:
      - eslint-config-cli:build
      - ts-config-cli:build
    inputs:
      - src/**/*.ts
      - tsconfig*.json
    outputs:
      - dist
  ts-lint:
    script: npx eslint src
    deps:
      - eslint-config-cli:build
    inputs:
      - src/**/*.ts
  ts-test:
    command: [npx, vitest, run]
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    options:
      cache: true
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "75"
      TS_COVERAGE_MIN_FUNCTIONS: "60"
      TS_COVERAGE_MIN_BRANCHES: "90"
      TS_COVERAGE_MIN_STATEMENTS: "75"
    inputs:
      - src/**/*.ts
      - vitest.config.ts
    outputs:
      - coverage
  ci-check:
    script: echo 'ci-check complete'
    deps:
      - build
      - lint
      - typecheck
      - test
      - coverage
      - format-check
      - npm-check
    options:
      cache: false
      mergeDeps: replace
  # The launcher resolves these exact versions at install time, so they
  # reach the registry first.
  npm-publish:
    deps:
      - agent-validate-go-darwin-arm64:npm-publish
      - agent-validate-go-darwin-x64:npm-publish
      - agent-validate-go-linux-arm64:npm-publish
      - agent-validate-go-linux-x64:npm-publish
      - agent-validate-go-win32-x64:npm-publish
    options:
      mergeDeps: append
  ci-publish:
    script: echo 'ci-publish complete'
    deps:
      - npm-publish
      - agent-validate-go-github:ci-publish
    options:
      cache: false
