$schema: https://moonrepo.dev/schemas/v2/project.json
language: typescript
tags: [typescript-script, typescript-integration]
dependsOn:
  - script-moon-common
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/prettier-config/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/tooling/script/script-moon-common/src/**/*
tasks:
  # These floors cover the unit tier alone. src/index.ts composes the node
  # adapters, including the npm publish call, and no unit spec runs it, so the
  # function total sits under what npm-publish.ts and publish.ts reach.
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "90"
      TS_COVERAGE_MIN_FUNCTIONS: "80"
      TS_COVERAGE_MIN_BRANCHES: "90"
      TS_COVERAGE_MIN_STATEMENTS: "90"
