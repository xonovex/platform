$schema: https://moonrepo.dev/schemas/v2/project.json
language: unknown
tags: [plugin, command, diagram]
tasks:
  ci-check:
    deps:
      - command-validate
      - build
      - format-check
      - diagram-role-check
      - graph-build
      - skill-planning-work:ci-check
      - skill-reflecting-on-sessions:ci-check
    options:
      mergeDeps: append
  graph-build:
    # The exports are tracked files: the script replaces one only when its
    # render changed, so Moon keeps no copy of them in its cache.
    command:
      - bash
      - $workspaceRoot/.moon/scripts/render-diagrams.sh
      - "diagrams"
      - svg
      - png
    inputs:
      - "diagrams/*.dot"
      - "/packages/asset/asset-brand/diagrams/style.gvpr"
      - "/.moon/scripts/render-diagrams.sh"
      - "/nix/general.nix"
      - "/flake.lock"
    outputs:
      - "diagrams/*.svg"
      - "diagrams/*.png"
    options:
      cache: false
