$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tags: [plugin, command, diagram]
tasks:
  ci-check:
    deps:
      - command-validate
      - build
      - format-check
      - diagram-role-check
      - graph-build
      - skill-plan:ci-check
      - skill-reflect:ci-check
    options:
      mergeDeps: append
  graph-build:
    # The mirrored Xonovex style gives each role its colours and the fonts;
    # the exports use its light mode on a white background.
    script: |
      set -euo pipefail
      export FONTCONFIG_FILE="${XONOVEX_DIAGRAM_FONTCONFIG_FILE:?The Nix environment must supply the diagram fonts}"
      for family in Inter 'Space Grotesk'; do
        if [ "$(fc-match --format '%{family[0]}' "$family")" != "$family" ]; then
          echo "Missing diagram font: $family" >&2
          exit 1
        fi
      done
      style="$workspaceRoot/packages/asset/asset-brand/diagrams/style.gvpr"
      shopt -s nullglob
      sources=(diagrams/*.dot)
      if [ "${#sources[@]}" -eq 0 ]; then
        echo 'No workflow diagram sources found' >&2
        exit 1
      fi
      for source in "${sources[@]}"; do
        styled=$(gvpr -c -a light -f "$style" "$source")
        printf '%s\n' "$styled" | dot -Gbgcolor=white -Tsvg -o "${source%.dot}.svg"
        printf '%s\n' "$styled" | dot -Gbgcolor=white -Gdpi=150 -Tpng -o "${source%.dot}.png"
      done
    toolchain: [system, nix]
    inputs:
      - "diagrams/*.dot"
      - "/packages/asset/asset-brand/diagrams/style.gvpr"
      - "/nix/general.nix"
      - "/flake.lock"
    outputs:
      - "diagrams/*.svg"
      - "diagrams/*.png"
