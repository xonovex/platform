$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tags: [plugin, command]
tasks:
  ci-check:
    deps:
      - command-validate
      - build
      - format-check
      - graph-build
      - skill-plan:ci-check
      - skill-reflect:ci-check
    options:
      mergeDeps: append
  graph-build:
    script: |
      export FONTCONFIG_FILE="${XONOVEX_DIAGRAM_FONTCONFIG_FILE:?The Nix environment must supply the diagram fonts}"
      for family in Inter 'Space Grotesk'; do
        if [ "$(fc-match --format '%{family[0]}' "$family")" != "$family" ]; then
          echo "Missing diagram font: $family" >&2
          exit 1
        fi
      done
      shopt -s nullglob
      sources=(diagrams/*.dot)
      if [ "${#sources[@]}" -eq 0 ]; then
        echo 'No workflow diagram sources found' >&2
        exit 1
      fi
      for source in "${sources[@]}"; do
        dot -Tsvg -o "${source%.dot}.svg" "$source"
        dot -Tpng -Gdpi=150 -o "${source%.dot}.png" "$source"
      done
    toolchain: [system, nix]
    inputs:
      - "diagrams/*.dot"
      - "/DESIGN.md"
      - "/nix/general.nix"
      - "/flake.lock"
    outputs:
      - "diagrams/*.svg"
      - "diagrams/*.png"
