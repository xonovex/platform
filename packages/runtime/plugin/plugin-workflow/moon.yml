$schema: https://moonrepo.dev/schemas/v2/project.json
language: unknown
tags: [plugin, diagram]
tasks:
  ci-check:
    deps:
      - build
      - format-check
      - diagram-role-check
      - graph-build
      - skill-approving-plan:ci-check
      - skill-closing-plan:ci-check
      - skill-critiquing-plan:ci-check
      - skill-defining-subplans:ci-check
      - skill-delegating-plan:ci-check
      - skill-distilling-plan:ci-check
      - skill-implementing-plan:ci-check
      - skill-reflecting-on-sessions:ci-check
      - skill-researching-changes:ci-check
      - skill-revising-plan:ci-check
      - skill-settling-questions:ci-check
      - skill-validating-plan:ci-check
      - skill-writing-plan:ci-check
    options:
      mergeDeps: append
  graph-build:
    # The exports are tracked files: the script replaces one only when its
    # render changed, so Moon keeps no copy of them in its cache.
    command:
      - bash
      - $workspaceRoot/.moon/scripts/render-diagrams.sh
      - "diagrams"
      - svg
      - png
    inputs:
      - "diagrams/*.dot"
      - "/packages/asset/asset-brand/diagrams/style.gvpr"
      - "/.moon/scripts/render-diagrams.sh"
      - "/nix/general.nix"
      - "/flake.lock"
    outputs:
      - "diagrams/*.svg"
      - "diagrams/*.png"
    options:
      cache: false
