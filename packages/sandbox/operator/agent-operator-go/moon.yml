$schema: https://moonrepo.dev/schemas/v2/project.json
language: go
layer: application
tags:
  - go
  - docker
dependsOn:
  - shared-core-go
  - shared-agent-go
  - shared-contract-go
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "75"
  go-package-coverage:
    script: |
      set -euo pipefail
      # Every package the module builds is named here. cmd/operator parses flags
      # and starts the manager, which go-test-integration covers under envtest,
      # test/testutil is test support, and config and the shared packages
      # declare interfaces and embedded manifests with no statements.
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh" \
        ./api/v1alpha1=100 \
        ./cmd/e2e-summary=87 \
        ./cmd/operator=exempt \
        ./config=exempt \
        ./internal/controller=95 \
        ./internal/harness/claude=85 \
        ./internal/harness/opencode=80 \
        ./internal/harness/shared=exempt \
        ./internal/isolation/shared=91 \
        ./internal/kube=100 \
        ./internal/network/shared=100 \
        ./internal/plugins=100 \
        ./internal/provider=90 \
        ./internal/provision/nix=100 \
        ./internal/provision/shared=exempt \
        ./internal/resolver=100 \
        ./internal/validator=100 \
        ./internal/webhook=87 \
        ./internal/wiring=100 \
        ./internal/workspace/git=100 \
        ./internal/workspace/jj=100 \
        ./internal/workspace/shared=97 \
        ./test/testutil=exempt
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
      - /.moon/scripts/strip-generated-coverage.sh
    options:
      cache: true
  coverage:
    command: noop
    deps:
      - go-test-coverage
      - go-package-coverage
    options:
      cache: false
      mergeDeps: replace
  # The architecture tests read the source trees of the operator and the CLI,
  # so they carry the arch build tag and run here instead of in go-test.
  go-test-arch:
    command:
      - go
      - test
      - -tags=arch
      - ./internal/arch/
    inputs:
      - "@globs(sources)"
      - /packages/tooling/cli/agent-cli-go/internal/**/*
    outputs: []
    options:
      cache: true
  test:
    command: noop
    deps:
      - go-test
      - go-test-arch
    options:
      cache: false
      mergeDeps: replace
  # go-test-integration downloads envtest assets and runs a real kube-apiserver
  # and etcd, so it is an integration tier rather than a ci-check gate.
  ci-integration:
    command: noop
    deps:
      - go-test-integration
    options:
      cache: false
      runInCI: false
  ci-e2e:
    command: noop
    deps: [go-test-e2e]
    options:
      cache: false
      runInCI: false
  ci-e2e-gvisor:
    command: noop
    deps: [go-test-e2e-gvisor]
    options:
      cache: false
      runInCI: false
  ci-e2e-kata:
    command: noop
    deps: [go-test-e2e-kata]
    options:
      cache: false
      runInCI: false
  ci-e2e-coco:
    command: noop
    deps: [go-test-e2e-coco]
    options:
      cache: false
      runInCI: false
  ci-e2e-summary:
    command:
      - go
      - run
      - ./cmd/e2e-summary
    inputs:
      - cmd/e2e-summary/**/*
    options:
      cache: false
      runInCI: false
  docker-build:
    command:
      - docker
      - build
      - -f
      - packages/sandbox/operator/agent-operator-go/Dockerfile
      - -t
      - ghcr.io/xonovex/agent-operator-go:latest
      - .
    inputs:
      - "@globs(sources)"
      - "@globs(dockerfiles)"
    outputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  # nix build fetches and realises store paths, so it stays out of CI.
  agent-image-build:
    command:
      - nix
      - build
      - .#legacyPackages.x86_64-linux.agentImage
    inputs:
      - /flake.nix
      - /flake.lock
      - /nix/agent-env.nix
      - /nix/mkAgentImage.nix
    outputs: []
    options:
      runInCI: false
      cache: false
      runFromWorkspaceRoot: true
  # envtest starts the control plane of the Kubernetes minor that k8s.io/api
  # names in go.mod. setup-envtest keeps those binaries in the ignored .cache
  # directory of the workspace, so the task writes nothing to a home directory.
  go-test-integration:
    script: |
      set -euo pipefail
      minor="$(go list -m -f '{{.Version}}' k8s.io/api | cut -d. -f2)"
      assets="$(setup-envtest use "1.${minor}.x" -p path --bin-dir "$workspaceRoot/.cache/envtest")"
      KUBEBUILDER_ASSETS="$assets" go test -tags=integration -v -timeout=300s ./test/integration/
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: false
      runInCI: false
  go-test-e2e:
    command:
      - go
      - test
      - -tags=e2e
      - -v
      - -timeout=600s
      - ./test/e2e/
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    env:
      TMPDIR: /var/tmp
    outputs: []
    options:
      runInCI: false
      cache: false
  go-test-e2e-gvisor:
    command:
      - go
      - test
      - -tags=e2e_gvisor
      - -v
      - -timeout=600s
      - ./test/e2e-gvisor/
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    env:
      TMPDIR: /var/tmp
    outputs: []
    options:
      runInCI: false
      cache: false
  go-test-e2e-kata:
    command:
      - go
      - test
      - -tags=e2e_kata
      - -v
      - -timeout=600s
      - ./test/e2e-kata/
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    env:
      TMPDIR: /var/tmp
    outputs: []
    options:
      runInCI: false
      cache: false
  go-test-e2e-coco:
    command:
      - go
      - test
      - -tags=e2e_coco
      - -v
      - -timeout=600s
      - ./test/e2e-coco/
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    env:
      TMPDIR: /var/tmp
    outputs: []
    options:
      runInCI: false
      cache: false
