$schema: https://moonrepo.dev/schemas/v2/project.json
tags:
  - go
  - shared
language: go
layer: library
dependsOn:
  - shared-agent-go
  - shared-contract-go
  - shared-core-go
fileGroups:
  # The run record schema is embedded in pkg/record, so a change to it
  # invalidates the build, the tests and the coverage runs.
  sources:
    - "**/*.go"
    - pkg/record/*.schema.json
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "99"
  go-package-coverage:
    script: |
      set -euo pipefail
      # Every package the module builds is named here. pkg/provision declares
      # the provisioning port and holds no statements. AvailableIsolations in
      # pkg/sandbox skips a lookup error that a listed method never returns.
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh" \
        ./pkg/credential=100 \
        ./pkg/isolation=100 \
        ./pkg/launch=100 \
        ./pkg/provision=exempt \
        ./pkg/record=100 \
        ./pkg/sandbox=97
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
      - /.moon/scripts/strip-generated-coverage.sh
    options:
      cache: true
      runInCI: true
  coverage:
    deps:
      - go-package-coverage
  # The architecture tests read the source tree, so they carry the arch build
  # tag and run here instead of in go-test.
  go-test-arch:
    command:
      - go
      - test
      - -tags=arch
      - ./internal/arch/
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  test:
    command: noop
    deps:
      - go-test
      - go-test-arch
    options:
      cache: false
      mergeDeps: replace
