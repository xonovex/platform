$schema: https://moonrepo.dev/schemas/v2/project.json
tags:
  - scripts
  - go
  - shared
language: go
layer: library
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "83"
  go-package-coverage:
    script: |
      set -euo pipefail
      # Every package the module builds is named here. pkg/process/osexec and
      # pkg/scratch/osscratch are the only packages that touch the host, so
      # go-test-integration covers them, and pkg/scratch declares an interface
      # and holds no statements.
      bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh" \
        ./pkg/colors=100 \
        ./pkg/envutil=100 \
        ./pkg/logging=75 \
        ./pkg/process=100 \
        ./pkg/process/osexec=exempt \
        ./pkg/process/processtest=100 \
        ./pkg/scratch=exempt \
        ./pkg/scratch/osscratch=exempt \
        ./pkg/scratch/scratchtest=100 \
        ./pkg/shell=100
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
      - /.moon/scripts/strip-generated-coverage.sh
    options:
      cache: true
      runInCI: true
  coverage:
    deps:
      - go-package-coverage
  # The architecture tests read the source tree, so they carry the arch build
  # tag and run here instead of in go-test.
  go-test-arch:
    command:
      - go
      - test
      - -tags=arch
      - ./internal/arch/
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  test:
    command: noop
    deps:
      - go-test
      - go-test-arch
    options:
      cache: false
      mergeDeps: replace
  # go-test-integration starts real programs and makes real temporary
  # directories, so it is an integration tier rather than a ci-check gate.
  go-test-integration:
    command:
      - go
      - test
      - -tags=integration
      - -v
      - ./pkg/process/osexec/
      - ./pkg/scratch/osscratch/
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: false
      runInCI: false
  ci-integration:
    command: noop
    deps:
      - go-test-integration
    options:
      cache: false
      runInCI: false
