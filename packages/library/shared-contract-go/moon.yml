$schema: https://moonrepo.dev/schemas/v2/project.json
tags:
  - go
  - shared
language: go
layer: library
fileGroups:
  # The schemas are embedded in pkg/schemas, so a change to one invalidates the
  # build, the tests and the coverage runs.
  sources:
    - "**/*.go"
    - pkg/schemas/*.json
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "98"
      # Every package the module builds is named here. pkg/fs/osfs is the only
      # package that touches a real disk, so go-test-integration covers it, and
      # pkg/jsonschema declares an interface and holds no statements.
      GO_PACKAGE_FLOORS: |
        ./pkg/condition=100
        ./pkg/discovery=100
        ./pkg/findings=100
        ./pkg/fs=100
        ./pkg/fs/memfs=98
        ./pkg/fs/osfs=exempt
        ./pkg/jsonschema=exempt
        ./pkg/jsonschema/tekuri=94
        ./pkg/report=100
        ./pkg/sarif=100
        ./pkg/schemas=95
        ./pkg/sources=100
        ./pkg/wiring=91
  # The architecture tests read the source tree, so they carry the arch build
  # tag and run here instead of in go-test.
  go-test-arch:
    command:
      - go
      - test
      - -tags=arch
      - ./internal/arch/
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  test:
    command: noop
    deps:
      - go-test
      - go-test-arch
    options:
      cache: false
      mergeDeps: replace
  # go-test-integration runs the os adapter against a real temporary directory,
  # so it is an integration tier rather than a ci-check gate.
  go-test-integration:
    command:
      - go
      - test
      - -tags=integration
      - -v
      - ./pkg/fs/osfs/
    deps:
      - go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: false
      runInCI: false
  ci-integration:
    command: noop
    deps:
      - go-test-integration
    options:
      cache: false
      runInCI: false
