$schema: https://moonrepo.dev/schemas/v2/project.json
tags:
  - go
  - shared
language: go
layer: library
dependsOn:
  - shared-contract-go
  # The architecture tests read the source through pkg/archtest.
  - shared-core-go
fileGroups:
  # The harness facts are embedded in pkg/agents, so a change to one
  # invalidates the build, the tests and the coverage runs.
  sources:
    - "**/*.go"
    - pkg/agents/harnesses/*.json
tasks:
  go-test-coverage:
    env:
      GO_COVERAGE_MIN: "98"
      # Every package the module builds is named here. pkg/provision and
      # pkg/types declare shared types and hold no statements.
      GO_PACKAGE_FLOORS: |
        ./pkg/agentcmd=100
        ./pkg/agents=100
        ./pkg/egress=100
        ./pkg/artifact=100
        ./pkg/isolation=100
        ./pkg/network=100
        ./pkg/overlay=100
        ./pkg/overlay/claude=100
        ./pkg/overlay/codex=100
        ./pkg/overlay/copilot=100
        ./pkg/overlay/kiro=100
        ./pkg/overlay/opencode=100
        ./pkg/overlay/pi=100
        ./pkg/overlay/shared=100
        ./pkg/plugin=100
        ./pkg/policy=100
        ./pkg/providers=98
        ./pkg/provision=exempt
        ./pkg/provision/nix=85
        ./pkg/types=exempt
        ./pkg/validation=85
        ./pkg/workspace=100
    inputs:
      - /packages/library/shared-contract-go/**/*.go
      - /packages/library/shared-contract-go/**/*.json
  # The architecture tests read the source of every library module and of every
  # module that ships a binary, so they carry the arch build tag and run here
  # instead of in go-test.
  go-test-arch:
    command:
      - go
      - test
      - -tags=arch
      - ./internal/arch/
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /packages/library/*-go/**/*.go
      - /packages/tooling/cli/agent-cli-go/**/*.go
      - /packages/tooling/cli/agent-eval-go/**/*.go
      - /packages/tooling/cli/agent-validate-go/**/*.go
      - /packages/sandbox/operator/agent-operator-go/**/*.go
    outputs: []
    options:
      cache: true
  test:
    command: noop
    deps:
      - go-test
      - go-test-arch
    options:
      cache: false
      mergeDeps: replace
