$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
  - script-moon-skill-catalog-common
tasks:
  ts-build:
    deps:
      - script-moon-common:build
      - script-moon-skill-catalog-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-validate-links"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
  composition-check:
    command:
      - node
      - packages/script/script-moon-skill-validate-links/dist/src/index.js
      - .
    deps: [build]
    inputs:
      - /packages/skill/*/package.json
      - /packages/skill/*/.claude-plugin/plugin.json
      - /packages/skill/*/.codex-plugin/plugin.json
      - /packages/skill/*/*/SKILL.md
      - /packages/skill/*/*/SOURCES.md
      - /packages/skill/*/*/references/*.md
    options:
      runFromWorkspaceRoot: true
  ci-check:
    deps: [composition-check]
    options:
      mergeDeps: append
