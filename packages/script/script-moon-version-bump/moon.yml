$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script, typescript-integration]
dependsOn:
  - script-moon-common
fileGroups:
  dependencySources:
    - /packages/script/script-moon-common/src/**/*
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "83"
      TS_COVERAGE_MIN_FUNCTIONS: "82"
      TS_COVERAGE_MIN_BRANCHES: "74"
      TS_COVERAGE_MIN_STATEMENTS: "83"
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps: [coverage]
