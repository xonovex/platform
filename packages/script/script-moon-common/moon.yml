$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script, typescript-integration]
tasks:
  # These floors cover the unit tier alone. src/file-system.ts and
  # src/child-process.ts are the adapters onto a real disk and a real process,
  # which the unit tier cannot drive, so the function total sits below what every
  # logic module reaches. vitest.config.ts holds the per-file floors that keep the
  # in-memory FileSystem and the modules built on the port near full coverage.
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "90"
      TS_COVERAGE_MIN_FUNCTIONS: "81"
      TS_COVERAGE_MIN_BRANCHES: "79"
      TS_COVERAGE_MIN_STATEMENTS: "90"
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps: [coverage]
