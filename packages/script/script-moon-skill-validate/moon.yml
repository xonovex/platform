$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  composition-check:
    command:
      - npx
      - moon-skill-links
      - $workspaceRoot
    deps:
      - ~:build
    inputs:
      - "/packages/skill/*/*/SKILL.md"
      - "/packages/skill/*/*/references/*.md"
      - "/packages/skill/*/.claude-plugin/plugin.json"
      - "/packages/skill/*/.codex-plugin/plugin.json"
      - "/packages/skill/*/package.json"
    options:
      cache: false
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-validate"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
  ci-check:
    deps: [composition-check]
    options:
      mergeDeps: append
