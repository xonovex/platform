$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - shared-core
  - script-moon-common
tasks:
  composition-check:
    command:
      - node
      - packages/script/script-moon-skill-validate/dist/src/links-cli.js
      - .
    deps: [build]
    inputs:
      - /packages/skill/composition-catalog.json
      - /packages/skill/*/package.json
      - /packages/skill/*/.claude-plugin/plugin.json
      - /packages/skill/*/.codex-plugin/plugin.json
      - /packages/skill/*/*/SKILL.md
      - /packages/skill/*/*/SOURCES.md
      - /packages/skill/*/*/references/*.md
      - /packages/skill/skill-workflow/workflow-guide/assets/composition-catalog.json
      - /packages/command/command-workflow/docs/*.md
      - /packages/command/command-workflow/commands/*.md
    options:
      runFromWorkspaceRoot: true
  composition-sync:
    command:
      - node
      - packages/script/script-moon-skill-validate/dist/src/sync-composition-catalog-cli.js
      - .
    deps: [build]
    inputs:
      - /packages/skill/composition-catalog.json
      - /packages/skill/skill-workflow/workflow-guide/assets/composition-catalog.json
    outputs:
      - /packages/skill/skill-workflow/workflow-guide/assets/composition-catalog.json
    options:
      cache: false
      runFromWorkspaceRoot: true
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps: [composition-check, coverage]
  ts-test:
    deps:
      - shared-core:build
    inputs:
      - /packages/skill/composition-catalog.json
      - /packages/skill/skill-skill/skill-guide/assets/**/*
      - /packages/skill/skill-workflow/workflow-guide/assets/composition-catalog.json
  ts-coverage:
    deps:
      - shared-core:build
    inputs:
      - /packages/skill/composition-catalog.json
      - /packages/skill/skill-skill/skill-guide/assets/**/*
      - /packages/skill/skill-workflow/workflow-guide/assets/composition-catalog.json
  ts-build:
    deps:
      - shared-core:build
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-validate"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
