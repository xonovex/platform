$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  composition-check:
    command:
      - node
      - packages/script/script-moon-skill-validate/dist/src/links-cli.js
      - .
    deps: [build]
    options:
      runFromWorkspaceRoot: true
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps: [composition-check, coverage]
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-validate"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
