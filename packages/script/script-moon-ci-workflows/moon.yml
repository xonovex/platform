$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
  - script-moon-skill-eval-outputs
  - script-moon-skill-eval-triggers
tasks:
  bin-permissions:
    command: [chmod, +x, dist/src/index.js]
    deps: [ts-build]
    inputs: [dist/src/index.js]
    options:
      cache: false
  build:
    deps: [bin-permissions]
  ts-build:
    deps:
      - script-moon-common:build
      - script-moon-skill-eval-outputs:build
      - script-moon-skill-eval-triggers:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-ci-workflows"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
  workflow-validate:
    command:
      - node
      - packages/script/script-moon-ci-workflows/dist/src/index.js
      - validate
    deps:
      - ~:build
    inputs:
      - src/**/*
      - moon.yml
      - /package-lock.json
      - /.github/workflows/ci.yml
      - /.github/workflows/release.yml
      - /.github/workflows/e2e.yml
      - /.github/workflows/skill-evals.yml
      - /.moon/tasks/tag-skill.yml
      - /packages/agent/agent-operator-go/moon.yml
      - /packages/script/script-moon-release-validate/moon.yml
    options:
      runFromWorkspaceRoot: true
  e2e-matrix:
    command:
      - node
      - packages/script/script-moon-ci-workflows/dist/src/index.js
      - e2e-matrix
    deps:
      - ~:build
    options:
      runFromWorkspaceRoot: true
      runInCI: false
  skill-eval-matrix:
    command:
      - node
      - packages/script/script-moon-ci-workflows/dist/src/index.js
      - skill-eval-matrix
    deps:
      - ~:build
    options:
      runFromWorkspaceRoot: true
      runInCI: false
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps:
      - coverage
      - workflow-validate
    options:
      mergeDeps: append
