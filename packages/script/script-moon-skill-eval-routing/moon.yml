$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script, typescript-integration]
dependsOn:
  - script-moon-common
  - script-moon-skill-eval-common
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/prettier-config/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/script/script-moon-common/src/**/*
    - /packages/script/script-moon-skill-eval-common/src/**/*
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "90"
      TS_COVERAGE_MIN_FUNCTIONS: "92"
      TS_COVERAGE_MIN_BRANCHES: "80"
      TS_COVERAGE_MIN_STATEMENTS: "90"
  ci-routing:
    script: >-
      npx moon-skill-eval-routing packages/skill
      --split "${SKILL_ROUTING_SPLIT:-validation}"
      --runs "${SKILL_ROUTING_RUNS:-3}"
      --owners "${SKILL_ROUTING_OWNERS:-}"
      --threshold 0.5
      --batch-size 8
      --max-budget-usd 0.05
      --workspace ".skill-eval-results/routing/${SKILL_EVAL_HARNESS:-claude}"
    inputs:
      - /packages/skill/*/*/eval-queries.json
      - /packages/skill/*/*/SKILL.md
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
