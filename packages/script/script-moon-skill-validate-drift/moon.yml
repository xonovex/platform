$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
  - script-moon-skill-catalog-common
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/prettier-config/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/script/script-moon-common/src/**/*
    - /packages/script/script-moon-skill-catalog-common/src/**/*
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "90"
      TS_COVERAGE_MIN_FUNCTIONS: "85"
      TS_COVERAGE_MIN_BRANCHES: "85"
      TS_COVERAGE_MIN_STATEMENTS: "90"
  drift-check:
    command:
      - node
      - packages/script/script-moon-skill-validate-drift/dist/src/index.js
    deps: [build]
    env:
      XONOVEX_LINT_MODE: enforce
    inputs:
      - /budgets.json
      - /vocabulary.json
      - /packages/command/*/commands/*.md
      - /packages/skill/*/*/SKILL.md
      - /packages/skill/*/*/references/*.md
    options:
      runFromWorkspaceRoot: true
  ci-check:
    deps: [drift-check]
    options:
      mergeDeps: append
