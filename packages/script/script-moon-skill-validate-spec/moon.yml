$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
  - script-moon-skill-catalog-common
tasks:
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ts-test:
    inputs:
      - /packages/skill/skill-skill/skill-guide/assets/**/*
  ts-coverage:
    inputs:
      - /packages/skill/skill-skill/skill-guide/assets/**/*
  ts-build:
    deps:
      - script-moon-common:build
      - script-moon-skill-catalog-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-validate-spec"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
