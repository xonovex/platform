$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  bin-permissions:
    command: [chmod, +x, dist/src/index.js]
    deps: [ts-build]
    inputs: [dist/src/index.js]
    options:
      cache: false
  build:
    deps: [bin-permissions]
  ts-build:
    deps:
      - script-moon-common:build
  # Floors sit just under this project's measured coverage, per the shared
  # template's per-project override contract.
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "55"
      TS_COVERAGE_MIN_FUNCTIONS: "100"
      TS_COVERAGE_MIN_BRANCHES: "45"
      TS_COVERAGE_MIN_STATEMENTS: "55"
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-action-graph"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
