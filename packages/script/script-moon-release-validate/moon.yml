$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script, typescript-integration]
dependsOn:
  - script-moon-common
fileGroups:
  dependencySources:
    - /packages/script/script-moon-common/src/**/*
tasks:
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ts-test:
    deps:
      - ~:ts-build
    options:
      mergeDeps: append
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "46"
      TS_COVERAGE_MIN_FUNCTIONS: "49"
      TS_COVERAGE_MIN_BRANCHES: "54"
      TS_COVERAGE_MIN_STATEMENTS: "48"
    deps:
      - ~:ts-build
    options:
      mergeDeps: append
  release-validate:
    command: node packages/script/script-moon-release-validate/dist/src/index.js
    deps:
      - ~:build
    inputs:
      - src/**/*
      # The filesystem-import check reads every package's TypeScript sources, so
      # without them a new direct node:fs import leaves this task's hash
      # unchanged and moon serves the previous pass from cache.
      - /packages/*/*/src/**/*.ts
      - /README.md
      - /package-lock.json
      - /.github/workflows/release.yml
      - /.moon/tasks/*.yml
      - /packages/*/*/moon.yml
      - /.claude-plugin/marketplace.json
      - /.agents/plugins/marketplace.json
      - /packages/command/*/package.json
      - /packages/command/*/.claude-plugin/plugin.json
      - /packages/skill/*/package.json
      - /packages/skill/*/.claude-plugin/plugin.json
      - /packages/skill/*/.codex-plugin/plugin.json
      - /AGENTS.md
      - /CLAUDE.md
      - /.moon/AGENTS.md
      - /.moon/CLAUDE.md
      - /packages/*/AGENTS.md
      - /packages/*/CLAUDE.md
      - /packages/*/*/AGENTS.md
      - /packages/*/*/CLAUDE.md
    options:
      runFromWorkspaceRoot: true
  ci-check:
    deps:
      - coverage
      - release-validate
    options:
      mergeDeps: append
