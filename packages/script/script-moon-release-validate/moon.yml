$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
tasks:
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ts-test:
    deps:
      - ~:ts-build
    options:
      mergeDeps: append
  ts-coverage:
    script: >-
      npx vitest run --coverage --coverage.include='src/**'
      --coverage.thresholds.lines 80
      --coverage.thresholds.functions 100
      --coverage.thresholds.branches 65
      --coverage.thresholds.statements 80
    deps:
      - ~:ts-build
    options:
      mergeDeps: append
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-release-validate"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
  release-validate:
    command: node packages/script/script-moon-release-validate/dist/src/index.js
    deps:
      - ~:build
    inputs:
      - src/**/*
      - /README.md
      - /package-lock.json
      - /.github/workflows/release.yml
      - /.claude-plugin/marketplace.json
      - /.agents/plugins/marketplace.json
      - /packages/command/*/package.json
      - /packages/command/*/.claude-plugin/plugin.json
      - /packages/skill/*/package.json
      - /packages/skill/*/.claude-plugin/plugin.json
      - /packages/skill/*/.codex-plugin/plugin.json
    options:
      runFromWorkspaceRoot: true
  ci-check:
    deps:
      - coverage
      - release-validate
    options:
      mergeDeps: append
