$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-eval-triggers"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
  ci-runtime:
    command:
      - npm
      - install
      - --no-save
      - "@anthropic-ai/claude-code@2.1.211"
    deps:
      - ~:install
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
