$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
  - script-moon-skill-eval-common
tasks:
  ts-test:
    inputs:
      - /packages/skill/*/*/eval-queries.json
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "90"
      TS_COVERAGE_MIN_FUNCTIONS: "95"
      TS_COVERAGE_MIN_BRANCHES: "85"
      TS_COVERAGE_MIN_STATEMENTS: "90"
    deps:
      - script-moon-common:build
      - script-moon-skill-eval-common:build
    inputs:
      - /packages/skill/*/*/eval-queries.json
  ts-build:
    deps:
      - script-moon-common:build
      - script-moon-skill-eval-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-eval-triggers"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
