$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  ts-test:
    inputs:
      - /packages/skill/*/*/eval-queries.json
  ts-coverage:
    script: >-
      npx vitest run --coverage --coverage.include='src/**'
      --coverage.thresholds.lines 80
      --coverage.thresholds.functions 80
      --coverage.thresholds.branches 70
      --coverage.thresholds.statements 80
    deps:
      - script-moon-common:build
    inputs:
      - /packages/skill/*/*/eval-queries.json
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-eval-triggers"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
  routing-owners-check:
    command:
      - node
      - packages/script/script-moon-skill-eval-triggers/dist/src/routing-owners-cli.js
      - packages/skill
    deps: [build]
    inputs:
      - /packages/skill/*/*/eval-queries.json
    options:
      runFromWorkspaceRoot: true
  ci-routing:
    script: >-
      npx moon-skill-eval-routing packages/skill
      --split "${SKILL_ROUTING_SPLIT:-all}"
      --runs "${SKILL_ROUTING_RUNS:-3}"
      --owners "${SKILL_ROUTING_OWNERS:-}"
      --threshold 0.5
      --batch-size 8
      --max-budget-usd 0.05
      --workspace ".skill-eval-results/routing/${SKILL_EVAL_HARNESS:-claude}"
    deps:
      - ~:install
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
