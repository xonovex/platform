$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
  - script-moon-skill-eval-common
tasks:
  ts-test:
    inputs:
      - /packages/skill/*/*/eval-queries.json
  ts-coverage:
    script: >-
      npx vitest run --coverage --coverage.include='src/**'
      --coverage.thresholds.lines 80
      --coverage.thresholds.functions 80
      --coverage.thresholds.branches 70
      --coverage.thresholds.statements 80
    deps:
      - script-moon-common:build
      - script-moon-skill-eval-common:build
    inputs:
      - /packages/skill/*/*/eval-queries.json
  ts-build:
    deps:
      - script-moon-common:build
      - script-moon-skill-eval-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-eval-triggers"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
