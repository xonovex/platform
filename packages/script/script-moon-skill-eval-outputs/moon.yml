$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  ts-coverage:
    script: >-
      npx vitest run --coverage --coverage.include='src/**'
      --coverage.thresholds.lines 85
      --coverage.thresholds.functions 85
      --coverage.thresholds.branches 75
      --coverage.thresholds.statements 85
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-eval-outputs"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
  ci-runtime:
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        case "${SKILL_EVAL_HARNESS:-claude}" in
          claude) npm install --no-save "@anthropic-ai/claude-code@2.1.211" ;;
          codex) npm install --no-save "@openai/codex@0.145.0" ;;
          *) printf 'unsupported skill eval harness: %s\n' "$SKILL_EVAL_HARNESS" >&2; exit 2 ;;
        esac
    deps:
      - ~:install
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
