$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script, typescript-integration]
dependsOn:
  - script-moon-common
  - script-moon-skill-eval-common
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/prettier-config/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/script/script-moon-common/src/**/*
    - /packages/script/script-moon-skill-eval-common/src/**/*
tasks:
  # These floors cover the unit tier alone, and src/output-harness.ts is spawn
  # plumbing only test/specs/integration reaches, so the project totals sit lower
  # than every logic module does. vitest.config.ts holds the per-file floors that
  # keep those modules near full coverage.
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "85"
      TS_COVERAGE_MIN_FUNCTIONS: "87"
      TS_COVERAGE_MIN_BRANCHES: "82"
      TS_COVERAGE_MIN_STATEMENTS: "85"
