$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  ts-coverage:
    script: >-
      npx vitest run --coverage --coverage.include='src/**'
      --coverage.thresholds.lines 85
      --coverage.thresholds.functions 85
      --coverage.thresholds.branches 75
      --coverage.thresholds.statements 85
    deps:
      - script-moon-common:build
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-eval-outputs"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
