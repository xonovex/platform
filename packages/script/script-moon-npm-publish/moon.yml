$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script, typescript-integration]
dependsOn:
  - script-moon-common
fileGroups:
  dependencySources:
    - /packages/script/script-moon-common/src/**/*
tasks:
  # These floors cover the unit tier alone. The defaultDependencies in src/cli.ts
  # are the fs and npm plumbing behind the PublishDependencies port, which reads
  # and writes relative to the process directory; only test/specs/integration can
  # drive them, so the function total sits well under what publish.ts reaches.
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "85"
      TS_COVERAGE_MIN_FUNCTIONS: "54"
      TS_COVERAGE_MIN_BRANCHES: "90"
      TS_COVERAGE_MIN_STATEMENTS: "85"
