$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "90"
      TS_COVERAGE_MIN_FUNCTIONS: "80"
      TS_COVERAGE_MIN_BRANCHES: "90"
      TS_COVERAGE_MIN_STATEMENTS: "90"
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-npm-publish"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
