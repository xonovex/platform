$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
  - script-moon-skill-eval-common
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "90"
      TS_COVERAGE_MIN_FUNCTIONS: "95"
      TS_COVERAGE_MIN_BRANCHES: "80"
      TS_COVERAGE_MIN_STATEMENTS: "90"
  ts-build:
    deps:
      - script-moon-common:build
      - script-moon-skill-eval-common:build
  routing-owners-check:
    command:
      - node
      - packages/script/script-moon-skill-validate-routing-owners/dist/src/index.js
      - packages/skill
    deps: [build]
    inputs:
      - /packages/skill/*/*/eval-queries.json
    options:
      runFromWorkspaceRoot: true
  ci-check:
    deps: [routing-owners-check]
    options:
      mergeDeps: append
