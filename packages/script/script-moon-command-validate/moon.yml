$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  bin-permissions:
    command: [chmod, +x, dist/src/index.js]
    deps: [ts-build]
    inputs: [dist/src/index.js]
    options:
      cache: false
  build:
    deps: [bin-permissions]
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "85"
      TS_COVERAGE_MIN_FUNCTIONS: "90"
      TS_COVERAGE_MIN_BRANCHES: "70"
      TS_COVERAGE_MIN_STATEMENTS: "80"
  ts-build:
    deps:
      - script-moon-common:build
  ci-check:
    deps: [coverage]
    options:
      mergeDeps: append
