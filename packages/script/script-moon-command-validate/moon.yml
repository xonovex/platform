$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "85"
      TS_COVERAGE_MIN_FUNCTIONS: "90"
      TS_COVERAGE_MIN_BRANCHES: "70"
      TS_COVERAGE_MIN_STATEMENTS: "80"
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-command-validate"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
  ci-check:
    deps: [coverage]
    options:
      mergeDeps: append
