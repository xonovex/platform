$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
fileGroups:
  dependencySources:
    - /packages/script/script-moon-common/src/**/*
tasks:
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "85"
      TS_COVERAGE_MIN_FUNCTIONS: "90"
      TS_COVERAGE_MIN_BRANCHES: "70"
      TS_COVERAGE_MIN_STATEMENTS: "80"
  ci-check:
    deps: [coverage]
    options:
      mergeDeps: append
