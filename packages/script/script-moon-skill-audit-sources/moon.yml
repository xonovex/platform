$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script, typescript-integration]
dependsOn:
  - script-moon-common
fileGroups:
  # The src of every internal package this project reads: what dependsOn
  # reaches, plus the config packages its own config files name.
  dependencySources:
    - /packages/config/eslint-config-base/src/**/*
    - /packages/config/eslint-config-cli/src/**/*
    - /packages/config/prettier-config/src/**/*
    - /packages/config/ts-config-build/src/**/*
    - /packages/config/ts-config-cli/src/**/*
    - /packages/config/ts-config-node/src/**/*
    - /packages/script/script-moon-common/src/**/*
tasks:
  # The parity test runs the shipped auditor through uv, which the Nix shell
  # supplies; resolving it from the caller's PATH is what let CI run without it.
  ts-coverage:
    toolchain: [system, nix]
    env:
      TS_COVERAGE_MIN_LINES: "78"
      TS_COVERAGE_MIN_FUNCTIONS: "74"
      TS_COVERAGE_MIN_BRANCHES: "60"
      TS_COVERAGE_MIN_STATEMENTS: "75"
  ts-test:
    toolchain: [system, nix]
    inputs:
      - /packages/skill/skill-skill/skill-guide/scripts/audit-sources.py
