$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "80"
      TS_COVERAGE_MIN_FUNCTIONS: "75"
      TS_COVERAGE_MIN_BRANCHES: "60"
      TS_COVERAGE_MIN_STATEMENTS: "75"
  bin-permissions:
    command: [chmod, +x, dist/src/index.js]
    deps: [ts-build]
    inputs: [dist/src/index.js]
    options:
      cache: false
  build:
    deps: [bin-permissions]
  ts-build:
    deps:
      - script-moon-common:build
  ts-test:
    inputs:
      - /packages/skill/skill-skill/skill-guide/scripts/audit-sources.py
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-audit-sources"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
