$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  bin-permissions:
    command: [chmod, +x, dist/src/index.js]
    deps: [ts-build]
    inputs: [dist/src/index.js]
    options:
      cache: false
  build:
    deps: [bin-permissions]
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-skill-audit-sources"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
