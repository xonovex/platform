$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
fileGroups:
  dependencySources:
    - /packages/script/script-moon-common/src/**/*
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "60"
      TS_COVERAGE_MIN_FUNCTIONS: "75"
      TS_COVERAGE_MIN_BRANCHES: "50"
      TS_COVERAGE_MIN_STATEMENTS: "60"
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps: [coverage]
