$schema: https://moonrepo.dev/schemas/project.json
language: typescript
tags: [typescript-script]
dependsOn:
  - script-moon-common
tasks:
  ts-coverage:
    env:
      TS_COVERAGE_MIN_LINES: "60"
      TS_COVERAGE_MIN_FUNCTIONS: "75"
      TS_COVERAGE_MIN_BRANCHES: "50"
      TS_COVERAGE_MIN_STATEMENTS: "60"
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  ci-check:
    deps: [coverage]
  ts-build:
    deps:
      - script-moon-common:build
  install:
    command:
      - npm
      - install
      - -w
      - "@xonovex/script-moon-npm-check"
    deps:
      - ~:build
    options:
      cache: false
      runFromWorkspaceRoot: true
