$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tasks:
  graph-build:
    command: noop
    deps:
      - graph-build-workflow
      - graph-build-target
      - graph-build-autonomy
      - graph-build-developer
      - graph-build-pm
      - graph-build-qa
      - graph-build-ux
  graph-build-workflow:
    command: dot -Tpng -o workflow-diagram.png workflow-diagram.dot
    inputs:
      - workflow-diagram.dot
    outputs:
      - workflow-diagram.png
    options:
      cache: true
  graph-build-target:
    command: dot -Tpng -o target-architecture.png target-architecture.dot
    inputs:
      - target-architecture.dot
    outputs:
      - target-architecture.png
    options:
      cache: true
  graph-build-autonomy:
    command: dot -Tpng -o autonomy-ladder.png autonomy-ladder.dot
    inputs:
      - autonomy-ladder.dot
    outputs:
      - autonomy-ladder.png
    options:
      cache: true
  graph-build-developer:
    command: dot -Tpng -o developer-workflow.png developer-workflow.dot
    inputs:
      - developer-workflow.dot
    outputs:
      - developer-workflow.png
    options:
      cache: true
  graph-build-pm:
    command: dot -Tpng -o pm-workflow.png pm-workflow.dot
    inputs:
      - pm-workflow.dot
    outputs:
      - pm-workflow.png
    options:
      cache: true
  graph-build-qa:
    command: dot -Tpng -o qa-workflow.png qa-workflow.dot
    inputs:
      - qa-workflow.dot
    outputs:
      - qa-workflow.png
    options:
      cache: true
  graph-build-ux:
    command: dot -Tpng -o ux-workflow.png ux-workflow.dot
    inputs:
      - ux-workflow.dot
    outputs:
      - ux-workflow.png
    options:
      cache: true
