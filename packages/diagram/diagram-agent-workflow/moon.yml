$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tasks:
  ci-check:
    command: noop
    deps: [graph-build]
    options:
      cache: false
  graph-build:
    command: dot -Tpng -o operation-model.png operation-model.dot
    inputs:
      - operation-model.dot
    outputs:
      - operation-model.png
    options:
      cache: true
