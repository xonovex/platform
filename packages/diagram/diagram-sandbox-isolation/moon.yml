$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tasks:
  ci-check:
    command: noop
    deps: [graph-build]
    options:
      cache: false
  graph-build:
    command: bash -c 'for f in *.dot; do dot -Tpng -Gdpi=150 -o "${f%.dot}.png" "$f"; done'
    inputs:
      - "*.dot"
    outputs:
      - "*.png"
    options:
      cache: true
