$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tags: [command]
dependsOn:
  - skill-agent-governance
  - skill-code-quality
  - skill-code-review
  - skill-plan
  - skill-pull-request
  - skill-testing
  - skill-workflow
tasks:
  build:
    command: echo 'build complete'
    options:
      cache: false
  test:
    command: npm run test
    inputs:
      - README.md
      - MIGRATION.md
      - docs/*.md
      - scripts/*.mjs
    options:
      cache: false
  ci-check:
    deps: [test]
    options:
      cache: false
      mergeDeps: append
