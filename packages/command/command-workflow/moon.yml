$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tags: [command]
tasks:
  build:
    command: echo 'build complete'
    options:
      cache: false
  cross-package-links:
    command:
      - node
      - packages/script/script-moon-skill-validate/dist/src/links-cli.js
    deps:
      - script-moon-skill-validate:build
    inputs:
      - /packages/skill/composition-catalog.json
      - /packages/skill/*/package.json
      - /packages/skill/*/.claude-plugin/plugin.json
      - /packages/skill/*/.codex-plugin/plugin.json
      - /packages/skill/*/*/SKILL.md
      - /packages/skill/*/*/SOURCES.md
      - /packages/skill/*/*/references/*.md
      - /packages/skill/skill-workflow/workflow-guide/assets/composition-catalog.json
      - /packages/command/command-workflow/docs/*.md
      - /packages/command/command-workflow/commands/*.md
      - /packages/script/script-moon-skill-validate/src/*.ts
    options:
      cache: false
      runFromWorkspaceRoot: true
  workflow-contract:
    command:
      - npx
      - moon-command-validate
      - .
      - --contract
      - contracts/workflow-commands.v1.json
      - --assets
      - ../../skill/skill-workflow/workflow-guide/assets
    deps:
      - script-moon-command-validate:install
    inputs:
      - contracts/*.json
      - commands/*.md
      - package.json
      - .claude-plugin/plugin.json
      - /packages/skill/skill-workflow/workflow-guide/SKILL.md
      - /packages/skill/skill-workflow/workflow-guide/assets/**/*.json
      - /packages/skill/skill-workflow/workflow-guide/references/*.md
      - /packages/script/script-moon-command-validate/src/*.ts
    options:
      cache: false
  workflow-schema-sync:
    command:
      - node
      - packages/script/script-moon-command-validate/dist/src/sync-workflow-composition-schema.js
      - packages/skill/skill-workflow/workflow-guide/assets/workflow-request.schema.json
    deps:
      - script-moon-command-validate:build
    inputs:
      - /packages/shared/shared-core/src/skill-composition-contract.ts
      - /packages/shared/shared-core/src/workflow-composition.ts
    outputs:
      - /packages/skill/skill-workflow/workflow-guide/assets/workflow-request.schema.json
    options:
      cache: false
      runFromWorkspaceRoot: true
  ci-check:
    deps: [cross-package-links, workflow-contract]
    options:
      cache: false
      mergeDeps: append
