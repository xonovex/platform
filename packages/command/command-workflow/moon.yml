$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tags: [command]
dependsOn:
  - skill-agent-governance
  - skill-code-quality
  - skill-code-review
  - skill-plan
  - skill-pull-request
  - skill-testing
  - skill-workflow
tasks:
  build:
    command: echo 'build complete'
    options:
      cache: false
  test:
    command: npm run test
    inputs:
      - README.md
      - MIGRATION.md
      - docs/*.md
      - scripts/*.mjs
    options:
      cache: false
  cross-package-links:
    command:
      - node
      - packages/script/script-moon-skill-validate/dist/src/links-cli.js
    deps:
      - script-moon-skill-validate:build
    inputs:
      - /packages/skill/*/*/SKILL.md
      - /packages/skill/*/*/references/*.md
      - /packages/command/command-workflow/docs/*.md
      - /packages/command/command-workflow/commands/*.md
      - /packages/script/script-moon-skill-validate/src/*.ts
    options:
      cache: false
      runFromWorkspaceRoot: true
  ci-check:
    deps: [test, cross-package-links]
    options:
      cache: false
      mergeDeps: append
