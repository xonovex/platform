$schema: https://moonrepo.dev/schemas/project.json
language: unknown
tags: [command]
tasks:
  build:
    command: echo 'build complete'
    options:
      cache: false
  test:
    command: npm run test
    inputs:
      - .claude-plugin/plugin.json
      - .codex-plugin/plugin.json
      - README.md
      - commands/*.md
      - docs/*.md
      - package.json
      - scripts/*.mjs
      - /packages/agent/**/*
      - /packages/command/**/*
      - /packages/diagram/**/*
      - /packages/shared/**/*
      - /packages/skill/**/*
      - /.agents/plugins/marketplace.json
      - /.claude-plugin/marketplace.json
    options:
      cache: false
  cross-package-links:
    command:
      - node
      - packages/script/script-moon-skill-validate/dist/src/links-cli.js
    deps:
      - script-moon-skill-validate:build
    inputs:
      - /packages/skill/*/*/SKILL.md
      - /packages/skill/*/*/references/*.md
      - /packages/command/command-workflow/docs/*.md
      - /packages/command/command-workflow/commands/*.md
      - /packages/script/script-moon-skill-validate/src/*.ts
    options:
      cache: false
      runFromWorkspaceRoot: true
  ci-check:
    deps: [test, cross-package-links]
    options:
      cache: false
      mergeDeps: append
