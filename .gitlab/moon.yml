$schema: https://moonrepo.dev/schemas/project.json
language: unknown
layer: configuration
tags:
  - ci
tasks:
  ci-config-format:
    script: npx prettier --write "$workspaceRoot/.gitlab/**/*.yml" --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "**/*.yml"
      - /.prettierignore
      - /prettier.config.ts
    outputs: []
    options:
      cache: false
      runInCI: false
  ci-config-format-check:
    script: npx prettier --check "$workspaceRoot/.gitlab/**/*.yml" --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "**/*.yml"
      - /.prettierignore
      - /prettier.config.ts
    outputs: []
    options:
      cache: true
  format:
    command: noop
    deps: [ci-config-format]
    options:
      cache: false
      runInCI: false
  format-check:
    command: noop
    deps: [ci-config-format-check]
    options:
      cache: false
  ci-check:
    command: noop
    deps:
      - format-check
    options:
      cache: false
