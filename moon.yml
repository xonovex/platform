$schema: https://moonrepo.dev/schemas/project.json
language: unknown
layer: configuration
tasks:
  # Prettier over the whole repository, so files in no package and packages
  # whose tags carry no prettier task are still checked. The tag templates
  # cover their own sources; this catches what falls between them, such as
  # markdown and JSON in Go, Rust and shell projects, and .devcontainer.
  workspace-format:
    script: npx prettier --write . --ignore-path "$workspaceRoot/.prettierignore"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  workspace-format-check:
    script: npx prettier --check . --ignore-path "$workspaceRoot/.prettierignore"
    options:
      cache: false
      runFromWorkspaceRoot: true
  format:
    command: noop
    deps: [workspace-format]
    options:
      cache: false
      runInCI: false
  format-check:
    command: noop
    deps: [workspace-format-check]
    options:
      cache: false
  # A release line moves as one transaction, so it is a workspace task rather
  # than a per-project one: a single invocation writes every member version and
  # every internal reference, leaving no state where the two disagree.
  version-bump-lockstep:
    command:
      - npx
      - moon-version-bump
    deps:
      - script-moon-version-bump:build
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  ci-check:
    command: noop
    deps: [format-check]
    options:
      cache: false
