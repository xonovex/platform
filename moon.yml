$schema: https://moonrepo.dev/schemas/v2/project.json
language: unknown
layer: configuration
tasks:
  # Prettier over the whole repository, so files in no package and packages
  # whose tags carry no prettier task are still checked. The tag templates
  # cover their own sources; this catches what falls between them, such as
  # markdown and JSON in Go and shell projects.
  workspace-format:
    script: npx prettier --write . --ignore-path "$workspaceRoot/.prettierignore"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  workspace-format-check:
    script: npx prettier --check . --ignore-path "$workspaceRoot/.prettierignore"
    options:
      cache: false
      runFromWorkspaceRoot: true
  format:
    command: noop
    deps: [workspace-format]
    options:
      cache: false
      runInCI: false
  format-check:
    command: noop
    deps: [workspace-format-check]
    options:
      cache: false
  # A release line moves as one transaction, so it is a workspace task rather
  # than a per-project one: a single invocation writes every member version and
  # every internal reference, leaving no state where the two disagree.
  version-bump-lockstep:
    command:
      - npx
      - moon-version-bump
    deps:
      - script-moon-version-bump:build
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  # The tests create temporary git repositories, so the task is explicit.
  mirror-test:
    command: [bash, .moon/scripts/mirror/test/mirror-test.sh]
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  # The checks that compare files with each other read the whole repository:
  # routing across skills, duplicated rules, links, budgets, the marketplaces,
  # instruction files and the Moon workspace. The per-skill and per-plugin tasks
  # run the checks that read one package.
  workspace-validate:
    script: >-
      "$workspaceRoot/packages/tooling/cli/agent-validate-go/dist/agent-validate"
      --strict --root "$workspaceRoot"
    deps:
      - agent-validate-go:binary
    options:
      cache: false
      runFromWorkspaceRoot: true
  # The model evals spend money, so they are explicit tasks. Name a plugin in
  # SKILL_ROUTING_PLUGIN to limit the run to its skills.
  ci-skill-eval-routing:
    script: >-
      "$workspaceRoot/packages/tooling/cli/agent-eval-go/dist/agent-eval"
      routing ${SKILL_ROUTING_PLUGIN:-}
      --split "${SKILL_ROUTING_SPLIT:-validation}"
      --runs "${SKILL_ROUTING_RUNS:-3}"
      --threshold 0.5
      --batch-size 8
      --max-cost-usd 0.05
      --harness "${SKILL_EVAL_HARNESS:-claude}"
      --results-dir "$workspaceRoot/.agent-eval/results"
      --plugin-dir packages/runtime/plugin
    deps:
      - agent-eval-go:binary
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  ci-check:
    command: noop
    deps: [format-check, workspace-validate]
    options:
      cache: false
