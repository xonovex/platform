$schema: https://moonrepo.dev/schemas/toolchain.json
go:
  version: null
npm:
  version: null
node:
  version: null
typescript:
  createMissingConfig: false
  syncProjectReferences: true
  syncProjectReferencesToPaths: true
javascript:
  packageManager: npm
  syncPackageManagerField: true
  syncProjectWorkspaceDependencies: true
  # Internal @xonovex/* dependencies are exact, so the dependency sync writes an
  # exact version rather than a caret range when it adds a dependsOn edge.
  dependencyVersionFormat: version
nix:
  plugin: "github://xonovex/platform/moon_nix_toolchain@moon_nix_toolchain-v0.8.3"
  shellByTag:
    ci: ci
    docker: docker
    go: go
    shell: shell
    rust: rust
    moon-plugin: rust
