$schema: https://moonrepo.dev/schemas/v2/tasks.json
implicitInputs:
  - /package-lock.json
tasks:
  build:
    command: noop
  plugin-format:
    script: npx prettier --write . --ignore-path "$workspaceRoot/.prettierignore"
    options:
      cache: false
      runInCI: false
  plugin-format-check:
    script: npx prettier --check . --ignore-path "$workspaceRoot/.prettierignore"
    inputs: ["**/*.md", "**/*.json", "**/*.yml"]
  plugin-validate:
    command:
      - npx
      - moon-plugin-validate
      - .
    deps:
      - target: ~:build
        optional: true
      - script-moon-plugin-validate:build
    inputs:
      - README.md
      - docs/**/*.md
      - package.json
      - .claude-plugin/plugin.json
      - skills/*/SKILL.md
    options:
      cache: false
  format:
    command: noop
    deps: [plugin-format]
    options:
      cache: false
      runInCI: false
      mergeDeps: append
  format-check:
    command: noop
    deps: [plugin-format-check]
    options:
      cache: false
      mergeDeps: append
  ci-check:
    command: echo 'ci-check complete'
    deps: [build, plugin-validate, format-check]
    options:
      cache: false
      mergeArgs: replace
inheritedBy:
  tag: plugin
