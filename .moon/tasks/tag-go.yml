$schema: https://moonrepo.dev/schemas/v2/tasks.json
# A module with no external requirement has no go.sum, so the go.sum input is
# optional.
implicitInputs:
  - go.mod
  - file://go.sum?optional
fileGroups:
  sources:
    - "**/*.go"
  tests:
    - "**/*_test.go"
  configs:
    - go.mod
    - go.sum
    - .golangci.yml
tasks:
  go-build:
    deps:
      - ^:build
    command:
      - go
      - build
      - ./...
    inputs:
      - "@globs(sources)"
      - go.mod
      - file://go.sum?optional
    outputs: []
    options:
      cache: true
  go-test:
    command:
      - go
      - test
      - -v
      - ./...
    deps:
      - ^:go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  # Each Go project sets GO_COVERAGE_MIN, the floor of the module without its
  # exempt packages, just under its own coverage, so a drop fails that project
  # instead of coasting on the weakest project's floor, and GO_PACKAGE_FLOORS,
  # the floor or the exemption of every package it builds. Neither has a default,
  # so a project that declares no floor fails.
  go-test-coverage:
    script: bash "$workspaceRoot/.moon/scripts/check-go-package-coverage.sh"
    deps:
      - ^:go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/check-go-package-coverage.sh
      - /.moon/scripts/strip-generated-coverage.sh
    outputs:
      - coverage.out
    options:
      cache: true
  go-lint:
    command:
      - golangci-lint
      - run
      - --allow-parallel-runners
      - ./...
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - .golangci.yml
    outputs: []
    options:
      cache: false
  go-format:
    command:
      - go
      - fmt
      - ./...
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: false
      runInCI: false
  go-format-check:
    command:
      - bash
      - -c
      - test -z "$(gofmt -l .)"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  go-typecheck:
    command:
      - go
      - vet
      - ./...
    deps:
      - ^:go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  go-tidy:
    command:
      - go
      - mod
      - tidy
    inputs:
      - go.mod
      - file://go.sum?optional
    outputs:
      - go.mod
      - go.sum
    options:
      cache: false
      runInCI: false
  build:
    command: noop
    deps: [go-build]
    options:
      cache: false
      mergeDeps: append
  lint:
    command: noop
    deps: [go-lint]
    options:
      cache: false
      mergeDeps: append
  typecheck:
    command: noop
    deps: [go-typecheck]
    options:
      cache: false
      mergeDeps: append
  test:
    command: noop
    deps: [go-test]
    options:
      cache: false
      mergeDeps: append
  coverage:
    command: noop
    deps: [go-test-coverage]
    options:
      cache: false
  format-check:
    command: noop
    deps: [go-format-check]
    options:
      cache: false
      mergeDeps: append
  format:
    command: noop
    deps: [go-format]
    options:
      cache: false
      runInCI: false
      mergeDeps: append
  ci-check:
    command: echo 'ci-check complete'
    deps: [build, lint, typecheck, test, coverage, format-check]
    options:
      cache: false
      # Replacing args keeps the command single when a project inherits two
      # templates that both own ci-check.
      mergeArgs: replace
  go-clean:
    script: rm -rf dist coverage.out
    options:
      cache: false
      runInCI: false
  clean:
    command: noop
    deps: [go-clean]
    options:
      cache: false
      runInCI: false
inheritedBy:
  tag: go
