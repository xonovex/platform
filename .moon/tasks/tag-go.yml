$schema: https://moonrepo.dev/schemas/tasks.json
implicitInputs:
  - go.mod
  - go.sum
fileGroups:
  sources:
    - "**/*.go"
  tests:
    - "**/*_test.go"
  configs:
    - go.mod
    - go.sum
    - .golangci.yml
tasks:
  go-build:
    deps:
      - ^:build
    command:
      - go
      - build
      - ./...
    toolchain: [system, nix]
    inputs:
      - "@globs(sources)"
      - go.mod
      - go.sum
    outputs: []
    options:
      cache: true
  go-test:
    command:
      - go
      - test
      - -v
      - ./...
    toolchain: [system, nix]
    deps:
      - ^:go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  go-test-coverage:
    script: |
      set -euo pipefail
      go test -v -coverprofile=coverage.out ./...
      bash "$workspaceRoot/.moon/scripts/strip-generated-coverage.sh" coverage.out
      coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
      awk -v coverage="$coverage" -v minimum="$GO_COVERAGE_MIN" 'BEGIN { if (coverage + 0 < minimum + 0) { printf "coverage %.1f%% is below %s%%\n", coverage, minimum > "/dev/stderr"; exit 1 } }'
    # GO_COVERAGE_MIN is the floor for a project that sets none of its own. Each
    # Go project overrides it to sit just under its own coverage, so a drop fails
    # that project instead of coasting on the weakest project's floor. Generated
    # files are stripped first, so the floor measures hand-written code.
    env:
      GO_COVERAGE_MIN: "55"
    toolchain: [system, nix]
    deps:
      - ^:go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - /.moon/scripts/strip-generated-coverage.sh
    outputs:
      - coverage.out
    options:
      cache: true
  go-lint:
    command:
      - golangci-lint
      - run
      - --allow-parallel-runners
      - ./...
    toolchain: [system, nix]
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - .golangci.yml
    outputs: []
    options:
      cache: false
  go-format:
    command:
      - go
      - fmt
      - ./...
    toolchain: [system, nix]
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: false
      runInCI: false
  go-format-check:
    command:
      - bash
      - -c
      - test -z "$(gofmt -l .)"
    toolchain: [system, nix]
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  go-typecheck:
    command:
      - go
      - vet
      - ./...
    toolchain: [system, nix]
    deps:
      - ^:go-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
    outputs: []
    options:
      cache: true
  go-tidy:
    command:
      - go
      - mod
      - tidy
    toolchain: [system, nix]
    inputs:
      - go.mod
      - go.sum
    outputs:
      - go.mod
      - go.sum
    options:
      cache: false
      runInCI: false
  build:
    command: noop
    deps: [go-build]
    options:
      cache: false
      mergeDeps: append
  lint:
    command: noop
    deps: [go-lint]
    options:
      cache: false
      mergeDeps: append
  typecheck:
    command: noop
    deps: [go-typecheck]
    options:
      cache: false
      mergeDeps: append
  test:
    command: noop
    deps: [go-test]
    options:
      cache: false
      mergeDeps: append
  coverage:
    command: noop
    deps: [go-test-coverage]
    options:
      cache: false
  format-check:
    command: noop
    deps: [go-format-check]
    options:
      cache: false
      mergeDeps: append
  format:
    command: noop
    deps: [go-format]
    options:
      cache: false
      runInCI: false
      mergeDeps: append
  ci-check:
    command: echo 'ci-check complete'
    deps: [build, lint, typecheck, test, format-check]
    options:
      cache: false
      # Replacing args keeps the command single when a project inherits two
      # templates that both own ci-check.
      mergeArgs: replace
  go-clean:
    script: rm -rf dist coverage.out
    options:
      cache: false
      runInCI: false
  clean:
    command: noop
    deps: [go-clean]
    options:
      cache: false
      runInCI: false
inheritedBy:
  tag: go
