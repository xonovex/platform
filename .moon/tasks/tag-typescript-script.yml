$schema: https://moonrepo.dev/schemas/tasks.json
extends: ./tag-typescript.yml
tasks:
  ts-build:
    deps: []
    options:
      mergeDeps: replace
  ts-test:
    deps: []
    options:
      mergeDeps: replace
  ts-test-watch:
    deps: []
    options:
      mergeDeps: replace
  # bin.js is the committed launcher npm links; the unmatched-pattern flag keeps
  # the shared-code packages, which ship no binary, lintable.
  ts-lint:
    script: npx eslint src bin.js --no-error-on-unmatched-pattern
    deps:
      - ts-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
      - bin.js
    options:
      mergeDeps: replace
  ts-lint-fix:
    script: npx eslint src bin.js --fix --no-error-on-unmatched-pattern
    deps:
      - ts-build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
      - bin.js
    options:
      mergeDeps: replace
  ts-typecheck:
    deps:
      - ts-build
    options:
      mergeDeps: replace
  ts-coverage:
    deps: []
    options:
      mergeDeps: replace
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  # ci-check spells out every gate because a task redefined across `extends`
  # replaces the inherited deps rather than appending to them.
  ci-check:
    deps: [build, lint, typecheck, test, format-check, coverage]
    options:
      cache: false
inheritedBy:
  tag: typescript-script
