$schema: https://moonrepo.dev/schemas/tasks.json
extends: ./tag-typescript.yml
tasks:
  ts-build:
    deps: []
    options:
      mergeDeps: replace
  ts-test:
    deps: []
    options:
      mergeDeps: replace
  ts-test-watch:
    deps: []
    options:
      mergeDeps: replace
  ts-lint:
    deps:
      - ts-build
    options:
      mergeDeps: replace
  ts-lint-fix:
    deps:
      - ts-build
    options:
      mergeDeps: replace
  ts-typecheck:
    deps:
      - ts-build
    options:
      mergeDeps: replace
  ts-coverage:
    deps: []
    options:
      mergeDeps: replace
  coverage:
    command: noop
    deps: [ts-coverage]
    options:
      cache: false
  # ci-check spells out every gate because a task redefined across `extends`
  # replaces the inherited deps rather than appending to them.
  ci-check:
    deps: [build, lint, typecheck, test, format-check, coverage]
    options:
      cache: false
inheritedBy:
  tag: typescript-script
