$schema: https://moonrepo.dev/schemas/v2/tasks.json
implicitInputs:
  # These tasks run prettier from the workspace install, so a tool upgrade
  # must invalidate their cached results.
  - /package-lock.json
tasks:
  skill-format:
    script: npx prettier --write "$projectRoot" --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "*.config.*"
    outputs: []
    options:
      cache: false
      runInCI: false
  skill-format-check:
    script: npx prettier --check "$projectRoot" --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "*.config.*"
    outputs: []
  format:
    command: noop
    deps: [skill-format]
    options:
      cache: false
      runInCI: false
      mergeDeps: append
  format-check:
    command: noop
    deps: [skill-format-check]
    options:
      cache: false
      mergeDeps: append
  build:
    command: echo 'build complete'
    options:
      cache: false
  ci-check:
    command: echo 'ci-check complete'
    deps:
      - build
      - format-check
      - skill-audit-sources
      - skill-validate
      - target: ~:test
        optional: true
    options:
      cache: false
      # Replacing args keeps the command single when a project inherits two
      # templates that both own ci-check.
      mergeArgs: replace
  # The checks that read one skill run per skill. The checks that compare
  # skills with each other (routing, duplicated rules, links, budgets) read the
  # whole catalog, so the workspace-validate task of the root project runs them.
  skill-validate:
    script: >-
      "$workspaceRoot/packages/tooling/cli/agent-validate-go/dist/agent-validate"
      skill sources text --strict
      --root "$workspaceRoot" --path "$projectSource"
    deps:
      - target: ~:build
        optional: true
      - agent-validate-go:binary
    inputs:
      - "**/*.md"
      - "**/*.md.template"
      - "**/*.json"
      - "**/*.json.template"
      - /agentic.validate.json
    options:
      cache: false
  # The limits are longer than the defaults of the tool (180 and 90 days). A
  # review of 2026-05-13, or of 2026-07-22 for a source with a version, stays
  # valid through 2027-02-28 and is stale on 2027-03-01. The audit makes no
  # network request: the fetching audit is the explicit skill-audit-sources-fetch
  # task.
  skill-audit-sources:
    script: >-
      "$workspaceRoot/packages/tooling/cli/agent-audit-go/dist/agent-audit"
      sources --max-age 291 --version-max-age 221 --strict .
    deps:
      - target: ~:build
        optional: true
      - agent-audit-go:binary
    inputs:
      - sources.json
      - sources.d/**/*.json
      - references/*.md
    options:
      cache: false
  skill-audit-sources-fetch:
    script: >-
      "$workspaceRoot/packages/tooling/cli/agent-audit-go/dist/agent-audit"
      sources --max-age 291 --version-max-age 221 --fetch --strict .
    deps:
      - agent-audit-go:binary
    options:
      cache: false
      runInCI: false
  skill-eval-triggers:
    script: >-
      "$workspaceRoot/packages/tooling/cli/agent-eval-go/dist/agent-eval"
      trigger "$(basename "$projectRoot")"
      --batch-size 8
      --results-dir "$workspaceRoot/.agent-eval/results"
      --plugin-dir ../..
    deps:
      - target: ~:build
        optional: true
      - agent-eval-go:binary
    options:
      cache: false
      runInCI: false
  skill-eval-outputs:
    script: >-
      "$workspaceRoot/packages/tooling/cli/agent-eval-go/dist/agent-eval"
      output "$(basename "$projectRoot")"
      --results-dir "$workspaceRoot/.agent-eval/results"
      --plugin-dir ../..
    deps:
      - target: ~:build
        optional: true
      - agent-eval-go:binary
    options:
      cache: false
      runInCI: false
  ci-skill-eval-trigger:
    script: >-
      "$workspaceRoot/packages/tooling/cli/agent-eval-go/dist/agent-eval"
      trigger "$(basename "$projectRoot")"
      --split validation
      --runs 3
      --max-cost-usd 0.05
      --batch-size 8
      --harness "${SKILL_EVAL_HARNESS:-claude}"
      --results-dir "$workspaceRoot/.agent-eval/results"
      --plugin-dir ../..
    deps:
      - target: ~:build
        optional: true
      - agent-eval-go:binary
    inputs:
      - /packages/runtime/plugin/AGENTS.md
    options:
      cache: false
      runInCI: false
  ci-skill-eval-output:
    script: >-
      "$workspaceRoot/packages/tooling/cli/agent-eval-go/dist/agent-eval"
      output "$(basename "$projectRoot")"
      --runs 2
      --concurrency 2
      --max-cost-usd 0.20
      --batch-size 3
      --harness "${SKILL_EVAL_HARNESS:-claude}"
      --results-dir "$workspaceRoot/.agent-eval/results"
      --plugin-dir ../..
    deps:
      - target: ~:build
        optional: true
      - agent-eval-go:binary
    inputs:
      - /packages/runtime/plugin/AGENTS.md
    options:
      cache: false
      runInCI: false
inheritedBy:
  tag: skill
