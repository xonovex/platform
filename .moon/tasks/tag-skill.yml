$schema: https://moonrepo.dev/schemas/tasks.json
implicitInputs:
  # These tasks run prettier and the moon-skill-* binaries from the workspace
  # install, so a tool upgrade must invalidate their cached results.
  - /package-lock.json
tasks:
  skill-format:
    script: npx prettier --write "$projectRoot" --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "*.config.*"
    outputs: []
    options:
      cache: false
      runInCI: false
  skill-format-check:
    script: npx prettier --check "$projectRoot" --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "*.config.*"
    outputs: []
  format:
    command: noop
    deps: [skill-format]
    options:
      cache: false
      runInCI: false
      mergeDeps: append
  format-check:
    command: noop
    deps: [skill-format-check]
    options:
      cache: false
      mergeDeps: append
  ci-check:
    command: echo 'ci-check complete'
    deps:
      - build
      - format-check
      - skill-audit-sources
      - skill-validate
      - target: ~:test
        optional: true
    options:
      cache: false
      # Replacing args keeps the command single when a project inherits two
      # templates that both own ci-check.
      mergeArgs: replace
  skill-validate:
    command:
      - node
      - $workspaceRoot/packages/tooling/script/script-moon-skill-validate-spec/bin.js
      - --strict
    deps:
      - target: ~:build
        optional: true
      - script-moon-skill-validate-routing:routing-check
      - script-moon-skill-validate-spec:build
    env:
      XONOVEX_LINT_MODE: enforce
    inputs:
      - "**/*.md"
      - "**/*.md.template"
      - "**/*.json"
      - "**/*.py"
      - /budgets.json
    options:
      cache: false
  skill-audit-sources:
    command:
      - node
      - $workspaceRoot/packages/tooling/script/script-moon-skill-audit-sources/bin.js
    deps:
      - target: ~:build
        optional: true
      - script-moon-skill-audit-sources:build
    options:
      cache: false
  skill-eval-triggers:
    command:
      - node
      - $workspaceRoot/packages/tooling/script/script-moon-skill-eval-triggers/bin.js
      - --batch-size
      - "8"
    deps:
      - target: ~:build
        optional: true
      - script-moon-skill-eval-triggers:build
    options:
      cache: false
      runInCI: false
  skill-eval-outputs:
    command:
      - node
      - $workspaceRoot/packages/tooling/script/script-moon-skill-eval-outputs/bin.js
      - --plugin-dir
      - ../..
    deps:
      - target: ~:build
        optional: true
      - script-moon-skill-eval-outputs:build
    options:
      cache: false
      runInCI: false
  ci-skill-eval-trigger:
    script: >-
      node "$workspaceRoot/packages/tooling/script/script-moon-skill-eval-triggers/bin.js"
      --split validation
      --runs 3
      --max-budget-usd 0.05
      --batch-size 8
      --workspace ".skill-eval-results/trigger/${SKILL_EVAL_HARNESS:-claude}"
      --plugin-dir ../..
      --catalog-root "$workspaceRoot/packages/runtime/plugin"
    deps:
      - target: ~:build
        optional: true
      - script-moon-skill-eval-triggers:build
    inputs:
      - /packages/runtime/plugin/AGENTS.md
      - /packages/runtime/plugin/plugin-agentic/skills/skill-guide/scripts/**/*
    options:
      cache: false
      runInCI: false
  ci-skill-eval-output:
    script: >-
      node "$workspaceRoot/packages/tooling/script/script-moon-skill-eval-outputs/bin.js"
      --runs 2
      --concurrency 2
      --max-budget-usd 0.10
      --judge-max-budget-usd 0.10
      --batch-size 3
      --workspace ".skill-eval-results/output/${SKILL_EVAL_HARNESS:-claude}"
      --plugin-dir ../..
      --eval-cwd "$workspaceRoot"
    deps:
      - target: ~:build
        optional: true
      - script-moon-skill-eval-outputs:build
    inputs:
      - /packages/runtime/plugin/AGENTS.md
      - /packages/runtime/plugin/plugin-agentic/skills/skill-guide/scripts/**/*
    options:
      cache: false
      runInCI: false
inheritedBy:
  tag: skill
