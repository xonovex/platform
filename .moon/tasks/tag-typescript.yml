$schema: https://moonrepo.dev/schemas/tasks.json
implicitInputs:
  - package.json
  - tsconfig*.json
  # The resolved versions of eslint, its plugins, tsc, and vitest live in the
  # root lockfile, not in any project's package.json. Without it a linter major
  # that changes which code passes serves a stale cached pass.
  - /package-lock.json
fileGroups:
  sources:
    - src/**/*
  tests:
    - test/**/*
  configs:
    - "*.config.*"
    - .eslintrc*
    - .prettierrc*
tasks:
  ts-build:
    deps:
      - ^:build
    script: npx tsc -p tsconfig.build.json
    inputs:
      - "@globs(sources)"
      - tsconfig*.json
    outputs:
      - dist
    options:
      cache: true
  ts-test:
    script: npx vitest run test/specs/unit
    deps:
      - ^:build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs: []
    options:
      cache: true
  ts-test-watch:
    script: npx vitest test/specs/unit
    deps:
      - ^:build
    options:
      cache: false
      persistent: true
    preset: server
  ts-lint:
    script: npx eslint src test --no-error-on-unmatched-pattern
    deps:
      - ts-build
      - ^:build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs: []
    options:
      cache: true
  ts-lint-fix:
    script: npx eslint src test --fix --no-error-on-unmatched-pattern
    deps:
      - ts-build
      - ^:build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs: []
    options:
      cache: false
      runInCI: false
  ts-format:
    script: npx prettier --write . --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
      - "*.json"
      - "*.md"
    outputs: []
    options:
      cache: false
      runInCI: false
  ts-format-check:
    script: npx prettier --check . --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
      - "*.json"
      - "*.md"
    outputs: []
    options:
      cache: true
  ts-typecheck:
    script: npx tsc --noEmit
    deps:
      - ts-build
      - ^:build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - tsconfig*.json
    outputs: []
    options:
      cache: true
  ts-coverage:
    script: >-
      npx vitest run test/specs/unit --coverage --coverage.include='src/**'
      --coverage.thresholds.lines "$TS_COVERAGE_MIN_LINES"
      --coverage.thresholds.functions "$TS_COVERAGE_MIN_FUNCTIONS"
      --coverage.thresholds.branches "$TS_COVERAGE_MIN_BRANCHES"
      --coverage.thresholds.statements "$TS_COVERAGE_MIN_STATEMENTS"
    # These are the floors for a project that sets none of its own. Each project
    # overrides them to sit just under its own coverage, so a drop fails that
    # project instead of coasting on the weakest project's floor.
    env:
      TS_COVERAGE_MIN_LINES: "50"
      TS_COVERAGE_MIN_FUNCTIONS: "50"
      TS_COVERAGE_MIN_BRANCHES: "50"
      TS_COVERAGE_MIN_STATEMENTS: "50"
    deps:
      - ^:build
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs:
      - coverage
    options:
      cache: true
  ts-clean:
    script: rm -rf dist coverage *.tsbuildinfo
    options:
      cache: false
      runInCI: false
  build:
    command: noop
    deps: [ts-build]
    options:
      cache: false
      mergeDeps: append
  lint:
    command: noop
    deps: [ts-lint]
    options:
      cache: false
      mergeDeps: append
  lint-fix:
    command: noop
    deps: [ts-lint-fix]
    options:
      cache: false
      runInCI: false
      mergeDeps: append
  format:
    command: noop
    deps: [ts-format]
    options:
      cache: false
      runInCI: false
      mergeDeps: append
  typecheck:
    command: noop
    deps: [ts-typecheck]
    options:
      cache: false
      mergeDeps: append
  test:
    command: noop
    deps: [ts-test]
    options:
      cache: false
      mergeDeps: append
  format-check:
    command: noop
    deps: [ts-format-check]
    options:
      cache: false
      mergeDeps: append
  clean:
    command: noop
    deps: [ts-clean]
    options:
      cache: false
      runInCI: false
  ci-check:
    command: echo 'ci-check complete'
    deps:
      - build
      - lint
      - typecheck
      - test
      - format-check
    options:
      cache: false
      # Replacing args keeps the command single when a project inherits two
      # templates that both own ci-check.
      mergeArgs: replace
inheritedBy:
  tag: typescript
