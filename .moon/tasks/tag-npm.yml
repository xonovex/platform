$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  # Every npm project gates publish readiness; npm-check verifies the packed
  # tarball resolves every exports, bin and relative import target.
  ci-check:
    deps:
      - npm-check
    options:
      mergeDeps: append
  npm-publish:
    command:
      - npx
      - moon-npm-publish
    deps:
      - target: ~:build
        optional: true
      - ^:npm-publish
      - ~:npm-check
      - script-moon-npm-publish:build
    inputs:
      - package.json
    options:
      cache: false
      runInCI: false
  npm-publish-dry-run:
    command:
      - npx
      - moon-npm-publish
      - --dry-run
    deps:
      - target: ~:build
        optional: true
      - ~:npm-check
      - script-moon-npm-publish:build
    inputs:
      - package.json
    options:
      cache: false
      runInCI: false
  ci-publish:
    command: echo 'ci-publish complete'
    deps:
      - npm-publish
    inputs:
      - package.json
    options:
      cache: false
      runInCI: false
  npm-check:
    command:
      - npx
      - moon-npm-check
    deps:
      - target: ~:build
        optional: true
      - script-moon-npm-check:build
    options:
      cache: false
  npm-lint-fix:
    script: npm pkg fix
    options:
      cache: false
      runInCI: false
  ci-publish-dry-run:
    command: echo 'ci-publish-dry-run complete'
    deps:
      - npm-publish-dry-run
    inputs:
      - package.json
    options:
      cache: false
      runInCI: false
  version-bump:
    command:
      - npx
      - moon-version-bump
    deps:
      - target: ~:build
        optional: true
      - script-moon-version-bump:build
    options:
      cache: false
      runInCI: false
inheritedBy:
  tag: npm
