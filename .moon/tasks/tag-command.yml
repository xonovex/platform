$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  command-format:
    script: npx prettier --write . --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "**/*.md"
      - "*.config.*"
      - package.json
    outputs: []
    options:
      cache: false
      runInCI: false
  command-format-check:
    script: npx prettier --check . --ignore-path "$workspaceRoot/.prettierignore"
    inputs:
      - "**/*.md"
      - "*.config.*"
      - package.json
    outputs: []
  command-validate:
    command:
      - npx
      - moon-command-validate
      - .
    deps:
      - target: ~:build
        optional: true
    inputs:
      - commands/*.md
      - docs/**/*.md
      - README.md
      - package.json
      - .claude-plugin/plugin.json
      - /budgets.json
      - /packages/skill/*/*/SKILL.md
    env:
      XONOVEX_LINT_MODE: enforce
    options:
      cache: false
  format:
    command: noop
    deps: [command-format]
    options:
      cache: false
      runInCI: false
      mergeDeps: append
  format-check:
    command: noop
    deps: [command-format-check]
    options:
      cache: false
      mergeDeps: append
  ci-check:
    command: echo 'ci-check complete'
    deps: [build, command-validate, format-check]
    options:
      cache: false
      # Replacing args keeps the command single when a project inherits two
      # templates that both own ci-check.
      mergeArgs: replace
inheritedBy:
  tag: command
