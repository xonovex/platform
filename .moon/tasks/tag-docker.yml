$schema: https://moonrepo.dev/schemas/v2/tasks.json
inheritedBy:
  tag: docker
fileGroups:
  dockerfiles:
    - Dockerfile
    - Dockerfile*
    - docker/**/Dockerfile*
tasks:
  docker-lint:
    command:
      - hadolint
      - Dockerfile
    inputs:
      - "@globs(dockerfiles)"
    outputs: []
    options:
      cache: true
  lint:
    command: noop
    deps: [docker-lint]
    options:
      cache: false
      mergeDeps: append
  ci-check:
    command: echo 'ci-check complete'
    deps: [lint]
    options:
      cache: false
      # Replacing args keeps the command single when a project inherits two
      # templates that both own ci-check.
      mergeArgs: replace
